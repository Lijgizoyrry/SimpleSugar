      if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, hits.length - 1); paint(); e.preventDefault(); }
      if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); paint(); e.preventDefault(); }
      if (e.key === 'Enter' && hits[sel]) { this.close(); Router.go('/r/' + hits[sel].r.id); }
    });
    el.addEventListener('click', e => {
      if (e.target.closest('[data-x]') || e.target.classList.contains('scrim')) return this.close();
      const c = e.target.closest('[data-pre]'); if (c) { presets.has(c.dataset.pre) ? presets.delete(c.dataset.pre) : presets.add(c.dataset.pre); run(); input.focus(); return; }
      const h = e.target.closest('.hit'); if (h) { this.close(); Router.go('/r/' + h.dataset.id); }
    });
    run(); setTimeout(() => input.focus(), 50);
  },
  close() { if (!this.el) return false; const el = this.el; this.el = null; el.style.transition = 'opacity .2s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 200); return true; },
};
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); Spot.open(); }
  else if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName) && Router.cur && Router.cur.view === 'home') { e.preventDefault(); Spot.open(); }
});
function markIn(text, terms) {
  const t = String(text); const n = norm(t);
  if (n.length !== t.length) return esc(t);
  let ranges = [];
  for (const term of terms) { let i = n.indexOf(term); if (i >= 0) ranges.push([i, i + term.length]); }
  if (!ranges.length) return esc(t);
  ranges.sort((a, b) => a[0] - b[0]);
  let out = '', pos = 0;
  for (const [a, b] of ranges) { if (a < pos) continue; out += esc(t.slice(pos, a)) + '<mark>' + esc(t.slice(a, b)) + '</mark>'; pos = b; }
  return out + esc(t.slice(pos));
}
function searchRecipes(q, presets) {
  const terms = norm(q).split(/\s+/).filter(Boolean);
  let list = Store.all();
  if (presets.has('quick')) list = list.filter(r => totalTime(r) > 0 && totalTime(r) <= 30);
  if (presets.has('easy')) list = list.filter(r => r.difficulty === 1);
  if (presets.has('patisserie') && !presets.has('cuisine')) list = list.filter(r => r.category !== 'cuisine');
  if (presets.has('cuisine') && !presets.has('patisserie')) list = list.filter(r => r.category === 'cuisine');
  if (!terms.length) return presets.size ? list.map(r => ({ r, title: esc(r.title), score: 0 })) : [];
  const out = [];
  for (const r of list) {
    const T = norm(r.title), D = norm(r.description);
    const ings = (r.ingredients || []).filter(i => !i.g).map(i => i.t);
    const NI = ings.map(norm);
    const ST = (r.steps || []).map(s => norm(s.title + ' ' + s.text));
    let score = 0, why = '', ok = true;
    for (const term of terms) {
      if (T.includes(term)) { score += T.startsWith(term) ? 14 : 10; continue; }
      const k = NI.findIndex(x => x.includes(term));
      if (k >= 0) { score += 5; if (!why) why = 'Ingrédient : ' + ings[k]; continue; }
      if (D.includes(term)) { score += 3; continue; }
      const sidx = ST.findIndex(x => x.includes(term));
      if (sidx >= 0) { score += 1; if (!why) why = `Étape ${sidx + 1} : ${r.steps[sidx].title || r.steps[sidx].text.slice(0, 60)}`; continue; }
      ok = false; break;
    }
    if (ok) out.push({ r, score, why, title: markIn(r.title, terms) });
  }
  return out.sort((a, b) => b.score - a.score);
}

function setTheme(t) {
  LS.set('theme', t);
  const root = document.documentElement;
  if (t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
  // barre d'état et barre d'adresse assorties au thème choisi
  $$('meta[name="theme-color"]').forEach(m => {
    if (t === 'dark' || t === 'light') { m.setAttribute('content', t === 'dark' ? '#0c0a10' : '#fbf3f6'); m.removeAttribute('media'); }
    else { if (m.dataset.c) m.setAttribute('content', m.dataset.c); if (m.dataset.m) m.setAttribute('media', m.dataset.m); }
  });
}
function exportAll() {
  const data = { app: 'SimpleSugar', version: 1, exported_at: new Date().toISOString(), recipes: Store.all().map(toRow) };
  const json = JSON.stringify(data, null, 1);
  const name = `simplesugar-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`;
  if (IS_PREVIEW) { Toast.show('Le téléchargement n’est pas disponible dans l’aperçu'); return; }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    Toast.show('Sauvegarde téléchargée');
  } catch { Toast.show('Téléchargement impossible sur cet appareil'); }
}
function importFile() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const list = Array.isArray(data) ? data : data.recipes;
      if (!Array.isArray(list) || !list.length) throw new Error('Aucune recette dans ce fichier.');
      const ok = await Sheet.confirm({ title: `Restaurer ${plural(list.length, 'recette', 'recettes')} ?`, text: 'Les recettes du fichier seront ajoutées, ou mises à jour si elles existent déjà. Les versions remplacées restent dans l’historique.', ok: 'Restaurer' });
      if (!ok) return;
      const n = await Store.importMany(list); Toast.show(`${plural(n, 'recette restaurée', 'recettes restaurées')}`);
    } catch (e) { Toast.show(e.message || 'Fichier illisible'); }
  };
  inp.click();
}

    const list = await Store.versions(r.id);
    $('#vl', s.sheet).innerHTML = list.length ? list.map(v => `<div class="ver-row">${ic('history')}<span style="min-width:0"><b>${esc(LBL[v.action] || v.action)}</b><small>${fmtDate(v.created_at)}${v.title && v.title !== r.title ? ` · « ${esc(v.title)} »` : ''}</small></span><button class="btn btn-sm" data-v="${v.id}">Restaurer</button></div>`).join('')
      : `<div><span class="grow foot">Pas encore de version précédente : l’historique se remplit à chaque enregistrement.</span></div>`;
  } catch (e) { $('#vl', s.sheet).innerHTML = `<div><span class="grow">${esc(Store.explain(e))}</span></div>`; }
  s.sheet.addEventListener('click', async e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    const ok = await Sheet.confirm({ title: 'Restaurer cette version ?', text: 'La version actuelle sera conservée dans l’historique.', ok: 'Restaurer' });
    if (!ok) return;
    try {
      const snap = await Store.versionSnapshot(b.dataset.v);
      const cur = Store.get(r.id) || r;
      const next = fixRecipe({ ...snap, id: r.id, updated_at: cur.updated_at });
      await Store.save(next, { force: true });
      s.close(); Toast.show('Version restaurée');
    } catch (err) { Toast.show(Store.explain(err)); }
  });
}

/* =========================================================================
   Mode pas à pas, minuteurs et « île » façon Dynamic Island
   ========================================================================= */
const Timers = {
  list: LS.get('timers', []).filter(t => t && t.id),
  subs: new Set(), timer: null, lastChime: 0, chimes: 0, title: document.title,
  on(fn) { this.subs.add(fn); return () => this.subs.delete(fn); },
  emit() { for (const f of [...this.subs]) { try { f(); } catch (e) { console.error(e); } } },
  save() { LS.set('timers', this.list); },
  get(id) { return this.list.find(t => t.id === id); },
  remaining(t) { return t.done ? 0 : t.end ? Math.max(0, t.end - Date.now()) : (t.left || 0); },
  next() { return [...this.list].sort((a, b) => (b.done - a.done) || (this.remaining(a) - this.remaining(b)))[0]; },
  find(recipeId, step) { return this.list.find(t => t.recipeId === recipeId && t.step === step); },
  start({ label, sec, recipeId = null, step = null }) {
    Sound.unlock();
    const t = { id: uid().slice(0, 8), label, dur: sec * 1000, end: Date.now() + sec * 1000, left: null, done: false, recipeId, step };
    this.list.push(t); this.save(); this.loop(); this.emit(); Island.render();
    return t;
  },
  toggle(id) {
    const t = this.get(id); if (!t || t.done) return;
    if (t.end) { t.left = t.end - Date.now(); t.end = null; } else { t.end = Date.now() + (t.left || 0); t.left = null; }
    this.save(); this.loop(); this.emit(); Island.render();
  },
  add(id, sec) {
    const t = this.get(id); if (!t) return;
    if (t.done) { t.done = false; t.end = Date.now() + sec * 1000; t.left = null; t.dur = sec * 1000; }
    else if (t.end) { t.end += sec * 1000; t.dur += sec * 1000; } else { t.left += sec * 1000; t.dur += sec * 1000; }
    this.save(); this.loop(); this.emit(); Island.render();
  },
  stop(id) { this.list = this.list.filter(t => t.id !== id); this.save(); this.emit(); Island.render(); if (!this.list.some(t => t.done)) document.title = this.title; },
  loop() { if (!this.timer && this.list.length) this.timer = setInterval(() => this.tick(), 250); },
  tick() {
    if (!this.list.length) { clearInterval(this.timer); this.timer = null; return; }
    let changed = false;
    for (const t of this.list) if (!t.done && t.end && t.end <= Date.now()) { t.done = true; t.end = null; t.left = 0; changed = true; }
    if (changed) { this.save(); this.emit(); Island.open = false; Island.render(); }
    const alarm = this.list.filter(t => t.done);
    if (alarm.length) {
      if (Date.now() - this.lastChime > 4500 && this.chimes < 8) { Sound.chime(); this.lastChime = Date.now(); this.chimes++; try { navigator.vibrate && navigator.vibrate([180, 90, 180]); } catch {} }
      document.title = (Math.floor(Date.now() / 1000) % 2 ? '⏰ ' : '') + alarm[0].label + ' : terminé';
    } else { this.chimes = 0; if (document.title !== this.title && !alarm.length) document.title = this.title; }
    Island.update();
    for (const el of document.querySelectorAll('[data-timer]')) { const t = this.get(el.dataset.timer); if (t) el.textContent = t.done ? 'Terminé' : fmtClock(this.remaining(t)); }
  },
};
function ringSVG(t, size = 26) {
  const r = size / 2 - 3, C = 2 * Math.PI * r;
  const frac = t.done ? 1 : 1 - Timers.remaining(t) / (t.dur || 1);
  return `<svg class="ring" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="3"/><circle class="rp" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${t.done ? '#fff' : '#ff7aa2'}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - frac)).toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})" data-c="${C}" data-id="${t.id}"/></svg>`;
}
const Island = {
  el: null, open: false,
  render() {
    document.body.classList.toggle('island-on', Timers.list.length > 0);
    if (!Timers.list.length) { if (this.el) { this.el.remove(); this.el = null; } this.open = false; return; }
    if (!this.el) {
      this.el = document.createElement('div'); this.el.className = 'island'; this.el.setAttribute('role', 'status'); this.el.tabIndex = 0;
      document.body.appendChild(this.el);
      this.el.addEventListener('click', e => this.onClick(e));
    }
    const alarm = Timers.list.some(t => t.done);
    this.el.classList.toggle('alarm', alarm && !this.open);
    this.el.classList.toggle('open', this.open);
    if (this.open) {
      this.el.innerHTML = `<div class="row" style="grid-template-columns:1fr auto"><span class="lbl" style="font-weight:600;color:#fff">Minuteurs</span><div class="ctl"><button data-close aria-label="Réduire">${ic('dn')}</button></div></div>
        <div class="rows">${Timers.list.map(t => `<div class="row ${t.done ? 'done' : ''}"><div style="min-width:0"><div class="lbl">${esc(t.label)}</div><div class="t num" data-timer="${t.id}">${t.done ? 'Terminé' : fmtClock(Timers.remaining(t))}</div></div>
          <div class="ctl">${t.done ? `<button data-ti="add" data-id="${t.id}" aria-label="Encore 1 minute">+1</button><button data-ti="stop" data-id="${t.id}" aria-label="OK">${ic('check')}</button>` : `<button data-ti="add" data-id="${t.id}" aria-label="Ajouter 1 minute">+1</button><button data-ti="toggle" data-id="${t.id}" aria-label="${t.end ? 'Pause' : 'Reprendre'}">${ic(t.end ? 'pause' : 'play')}</button><button data-ti="stop" data-id="${t.id}" aria-label="Arrêter">${ic('stop')}</button>`}</div></div>`).join('')}</div>`;
    } else {
      const t = Timers.next();
      this.el.innerHTML = `${t.done ? `<svg class="ring" viewBox="0 0 24 24">${ICONS.timer.replace(/<path/g, '<path fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"').replace(/<circle/g, '<circle fill="none" stroke="#fff" stroke-width="2"')}</svg>` : ringSVG(t)}<span class="t num" data-timer="${t.id}">${t.done ? 'Terminé' : fmtClock(Timers.remaining(t))}</span><span class="lbl">${esc(t.label)}${Timers.list.length > 1 ? ` · +${Timers.list.length - 1}` : ''}</span>`;
    }
  },
  update() {
    if (!this.el || this.open) return;
    const rp = this.el.querySelector('.rp'); if (!rp) return;
    const t = Timers.get(rp.dataset.id); if (!t) return;
    const C = +rp.dataset.c; const frac = 1 - Timers.remaining(t) / (t.dur || 1);
    rp.setAttribute('stroke-dashoffset', (C * (1 - frac)).toFixed(1));
  },
  onClick(e) {
    const b = e.target.closest('[data-ti]');
    if (b) { e.stopPropagation(); const id = b.dataset.id, a = b.dataset.ti; if (a === 'toggle') Timers.toggle(id); if (a === 'stop') Timers.stop(id); if (a === 'add') Timers.add(id, 60); return; }
    if (e.target.closest('[data-close]')) { e.stopPropagation(); this.open = false; this.render(); return; }
    if (!this.open) { e.stopPropagation(); this.open = true; this.render(); }
  },
};
document.addEventListener('click', e => { if (Island.open && Island.el && !Island.el.contains(e.target)) { Island.open = false; Island.render(); } });
Timers.loop(); setTimeout(() => Island.render(), 0);

function textWithDurations(text) {
  const raw = String(text || ''); const ds = findDurations(raw);
  if (!ds.length) return esc(raw);
  let out = '', pos = 0;
  for (const d of ds) {
    out += esc(raw.slice(pos, d.index));
    out += `<button class="dur" data-act="dur" data-min="${d.min}" title="Lancer un minuteur">${ic('timer')}${esc(d.text)}</button>`;
    pos = d.index + d.len;
  }
  return out + esc(raw.slice(pos));
}

/* ---------- analyse d'un texte collé ---------- */
function splitSteps(text) {
  const lines = String(text || '').split('\n');
  const numbered = /^\s*(?:(?:é|e)tape\s*(\d{1,2})\s*[.)\-–:/]?|(\d{1,2})\s*[.)\-–:/](?!\d))\s*/i;
  const hasNumbers = lines.filter(l => numbered.test(l)).length >= 2;
  const hasBlank = /\n\s*\n/.test(String(text).trim());
  const steps = []; let cur = null;
  for (const raw of lines) {
    const l = raw.trim();
    if (hasNumbers) {
      if (numbered.test(l)) { cur = { text: l.replace(numbered, '').replace(/^[-–•*·]\s*/, '') }; steps.push(cur); }
      else if (l && cur) cur.text += (cur.text ? ' ' : '') + l;
      else if (l) { cur = { text: l }; steps.push(cur); }
    } else if (hasBlank) {
      if (!l) { cur = null; continue; }
      if (!cur) { cur = { text: l.replace(/^[-–•*·]\s*/, '') }; steps.push(cur); } else cur.text += ' ' + l;
    } else if (l) steps.push({ text: l.replace(/^[-–•*·]\s*/, '') });
  }
  return steps.filter(s => s.text).map(s => {
    const st = blankStep(); let t = s.text.trim();
    const m = t.match(/^([^.:!?]{3,48})\s*:\s+(.{10,})$/);
    if (m && !/^\d/.test(m[1])) { st.title = m[1].trim(); t = m[2].trim(); }
    st.text = t;
    const d = findDurations(t); if (d.length && d[0].min >= 2) st.timer = Math.round(d[0].min);
    const tp = findTemp(t); if (tp && tp >= 90) st.temp = tp;
    return st;
  });
}
function parseRecipeText(text) {
  const out = { title: '', description: '', ingredients: [], equipment: [], steps: [], notes: '' };
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  const H = [
    ['ing', /^(?:#+\s*)?(?:les\s+)?ingr[ée]dients?\b.*?:?\s*$/i],
    ['steps', /^(?:#+\s*)?(?:la\s+)?(?:pr[ée]paration|[ée]tapes?|instructions?|d[ée]roul[ée]|m[ée]thode|r[ée]alisation|recette)\s*:?\s*$/i],
    ['equip', /^(?:#+\s*)?(?:ustensiles?|mat[ée]riel)\s*:?\s*$/i],
    ['notes', /^(?:#+\s*)?(?:notes?|astuces?|conseils?|remarques?)\s*:?\s*$/i],
  ];
  let sec = 'intro'; const intro = [], stepLines = [], notes = [];
  for (const raw of lines) {
    const l = raw.trim();
    const h = l && l.length < 60 ? H.find(([, re]) => re.test(l)) : null;
    if (h) { sec = h[0]; continue; }
    if (sec === 'intro') intro.push(l);
    else if (sec === 'ing') {
      const sv = l.match(/^(?:pour\s+)?(\d+)\s*(personnes?|parts?|pers\.?|portions?|convives?|pièces?)\s*$/i);
      if (sv) { out.servings = +sv[1]; out.servings_label = /^pers/i.test(sv[2]) ? 'personnes' : sv[2].toLowerCase(); }
      else if (l) out.ingredients.push(l);
    }
    else if (sec === 'equip') { if (l) out.equipment.push(...l.replace(/^[-–•*·]\s*/, '').split(/\s*[,;]\s*/).filter(Boolean)); }
    else if (sec === 'steps') stepLines.push(l);
    else if (sec === 'notes') notes.push(l);
  }
  let introLines = intro;
  if (!out.ingredients.length && !stepLines.length) {
    // pas de titres « Ingrédients » / « Préparation » : on devine ligne par ligne
    introLines = []; let first = true, inSteps = false;
    const isMeta = l => l.length < 120 && (/\bpour\s+\d+/i.test(l) || /(pr[ée]paration|cuisson|repos|temps)\s*:/i.test(l));
    for (const l of intro) {
      if (!l) { if (inSteps) stepLines.push(''); continue; }
      if (first && l.length < 90 && !/^[-–•*·]?\s*\d/.test(l)) { introLines.push(l); first = false; continue; }
      first = false;
      if (!inSteps && isMeta(l)) { introLines.push(l); continue; }
      const looksIng = /^[-–•*·]?\s*(\d|[½¼¾⅓⅔]|une?\s|quelques|sel\b|poivre\b)/i.test(l) && l.length < 90 && !/[.!?]$/.test(l);
      if (looksIng && !inSteps) out.ingredients.push(l); else { inSteps = true; stepLines.push(l); }
    }
  }
  const desc = [];
  for (const l of introLines) {
    if (!l) continue;
    let used = false;
    const sv = l.match(/\bpour\s+(\d+)\s*([a-zàâçéèêëîïôûùüÿœ]+)?/i);
    if (sv && l.length < 70) { out.servings = +sv[1]; if (sv[2] && !/^(min|h|g)$/i.test(sv[2])) out.servings_label = sv[2].toLowerCase(); used = true; }
    for (const [re, k] of [[/pr[ée]paration\s*:?\s*([^,;|·]+)/i, 'prep_min'], [/cuisson\s*:?\s*([^,;|·]+)/i, 'cook_min'], [/repos\s*:?\s*([^,;|·]+)/i, 'rest_min']]) {
      const m = l.match(re); if (m) { const d = findDurations(m[1]); if (d.length) { out[k] = Math.round(d[0].min); used = true; } }
    }
    if (used) continue;
    if (!out.title) out.title = l.replace(/^#+\s*/, '').slice(0, 120); else desc.push(l);
  }
  out.description = desc.join(' ').slice(0, 300);
  const merged = [];
  for (const raw of out.ingredients.map(l => l.replace(/^[-–•*·]\s*/, '').trim()).filter(Boolean)) {
    const prev = merged[merged.length - 1];
    const qtyOnly = x => /^(\d+(?:[.,]\d+)?|[½¼¾⅓⅔])\s*(?:[a-zà-ÿ.]{0,10}(?:\s*(?:à|a)\s*[a-zà-ÿ.]{1,6})?)?$/i.test(x) && parseIng(x + ' x').q != null;
    if (prev != null && qtyOnly(prev) && !/^\d/.test(raw) && !/:\s*$/.test(raw)) merged[merged.length - 1] = prev + ' ' + raw;
    else merged.push(raw);
  }
  out.ingredients = merged
    .map(l => /:\s*$/.test(l) && !/^\d/.test(l) ? { t: l.replace(/\s*:\s*$/, ''), g: 1 } : { t: l });
  out.steps = splitSteps(stepLines.join('\n'));
  out.notes = notes.join('\n').trim();
  const T = norm(out.title), all = norm(out.title + ' ' + out.ingredients.map(i => i.t).join(' '));
  const sweet = /(gateau|tarte|cookie|biscuit|creme|brioche|crepe|gaufre|cake|macaron|meringue|dessert|chocolat|sable|madeleine|financier|muffin|clafoutis|flan|mousse|entremets|chou|eclair|confiture|caramel|sucre)/.test(T);
  const savory = /(poulet|boeuf|porc|agneau|veau|poisson|saumon|cabillaud|lardon|jambon|oignon|echalote|bouillon|riz |risotto|pates|legume|tomate|parmesan|quiche|soupe|veloute|curry|gratin|salade|omelette)/.test(all);
  out.category = savory && !sweet ? 'cuisine' : 'patisserie';
  return out;
}

function pickImage() {

    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => res(inp.files && inp.files[0] || null);

function rdpFlat(p, eps) {
  const n = p.length / 2; if (n < 3) return p.slice();
  const keep = new Uint8Array(n); keep[0] = keep[n - 1] = 1;
  const stack = [[0, n - 1]];
  while (stack.length) {
    const [a, b] = stack.pop(); let md = 0, mi = -1;
    const ax = p[2 * a], ay = p[2 * a + 1], bx = p[2 * b], by = p[2 * b + 1];
    const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1;
    for (let i = a + 1; i < b; i++) { const d = Math.abs(dy * p[2 * i] - dx * p[2 * i + 1] + bx * ay - by * ax) / L; if (d > md) { md = d; mi = i; } }
    if (md > eps && mi > 0) { keep[mi] = 1; stack.push([a, mi], [mi, b]); }
  }
  const out = []; for (let i = 0; i < n; i++) if (keep[i]) out.push(Math.round(p[2 * i]), Math.round(p[2 * i + 1]));
  return out;
}

const Pad = {
  ov: null, _cancel: null,
  isOpen() { return !!this.ov; },
  close() { if (!this.ov) return false; this._cancel && this._cancel(); return true; },
  open(initial, onDone) {
    if (this.ov) return;
    let strokes = clone((initial && initial.s) || []);
    const start = JSON.stringify(strokes);
    const undo = [], redo = [];
    let color = LS.get('pad-color', 'ink'), width = LS.get('pad-w', 9), mode = 'pen';
    const COLORS = [['ink', 'Encre'], ['#ff375f', 'Framboise'], ['#ff9f0a', 'Abricot'], ['#ffd60a', 'Citron'], ['#30d158', 'Pistache'], ['#0a84ff', 'Myrtille'], ['#bf5af2', 'Violette'], ['#a2845e', 'Chocolat']];
    const SIZES = [[5, 'Fin', 6], [9, 'Moyen', 10], [16, 'Épais', 16]];
    const ov = frag(`<div class="pad" role="dialog" aria-modal="true" aria-label="Dessin de l’étape"><div class="mesh-lite"></div>
      <div class="pad-top"><button class="btn" data-a="cancel">Annuler</button><h2>Dessin de l’étape</h2><button class="btn btn-primary" data-a="done">${ic('check')}OK</button></div>
      <div class="pad-canvas"><div class="paper"><canvas aria-label="Zone de dessin"></canvas></div></div>
      <div class="pad-tools glass glass-strong">
        ${COLORS.map(([c, n]) => `<button class="swatch ${c === 'ink' ? 'ink' : ''}" style="${c === 'ink' ? '' : `--sw:${c}`}" data-c="${c}" aria-label="${n}"></button>`).join('')}
        <span class="tool-sep"></span>
        ${SIZES.map(([w, n, d]) => `<button class="size-dot" data-w="${w}" aria-label="Trait ${n}"><i style="--d:${d}px"></i></button>`).join('')}
        <span class="tool-sep"></span>
        <button class="icon-btn" data-a="eraser" aria-label="Gomme">${ic('eraser')}</button>
        <button class="icon-btn" data-a="undo" aria-label="Annuler le dernier trait">${ic('undo')}</button>
        <button class="icon-btn" data-a="redo" aria-label="Rétablir">${ic('redo')}</button>
        <button class="icon-btn" data-a="clear" aria-label="Tout effacer">${ic('trash')}</button>
      </div></div>`);
    document.body.appendChild(ov); this.ov = ov;
    const paper = $('.paper', ov), cv = $('canvas', ov), ctx = cv.getContext('2d');
    let k = 1, dpr = 1, inkColor = '#1d1d1f';
    const resize = () => {
      const r = paper.getBoundingClientRect(); dpr = Math.min(3, window.devicePixelRatio || 1);
      cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); k = cv.width / 1000;
      inkColor = getComputedStyle(document.body).color; draw();
    };
    const pathOn = (p) => {
      ctx.beginPath(); ctx.moveTo(p[0] * k, p[1] * k);
      if (p.length < 4) { ctx.lineTo(p[0] * k + .01, p[1] * k); return; }
      for (let i = 2; i < p.length - 2; i += 2) ctx.quadraticCurveTo(p[i] * k, p[i + 1] * k, (p[i] + p[i + 2]) / 2 * k, (p[i + 1] + p[i + 3]) / 2 * k);
      ctx.lineTo(p[p.length - 2] * k, p[p.length - 1] * k);
    };
    let cur = null;
    const draw = () => {
      ctx.clearRect(0, 0, cv.width, cv.height); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (const s of cur ? [...strokes, cur] : strokes) { ctx.strokeStyle = s.c === 'ink' ? inkColor : s.c; ctx.lineWidth = s.w * k; pathOn(s.p); ctx.stroke(); }
    };
    const syncTools = () => {
      $$('.swatch', ov).forEach(b => b.classList.toggle('on', mode === 'pen' && b.dataset.c === color));
      $$('.size-dot', ov).forEach(b => b.classList.toggle('on', +b.dataset.w === width));
      $('[data-a="eraser"]', ov).classList.toggle('sel', mode === 'eraser');
      $('[data-a="undo"]', ov).disabled = !undo.length; $('[data-a="redo"]', ov).disabled = !redo.length;
    };
    const snap = () => { undo.push(JSON.stringify(strokes)); if (undo.length > 80) undo.shift(); redo.length = 0; };
    const toL = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 1000, (e.clientY - r.top) / r.height * 750]; };
    let active = null, sawPen = false, erased = false, gestureSnap = '[]';
    const eraseAt = ([x, y]) => {
      const before = strokes.length;
      strokes = strokes.filter(s => {
        const p = s.p, R = 14 + s.w / 2;
        for (let i = 0; i < p.length; i += 2) {
          if (Math.hypot(p[i] - x, p[i + 1] - y) < R) return false;
          if (i + 3 < p.length) { // distance au segment
            const ax = p[i], ay = p[i + 1], bx = p[i + 2], by = p[i + 3]; const dx = bx - ax, dy = by - ay; const L2 = dx * dx + dy * dy || 1;
            const t = clamp(((x - ax) * dx + (y - ay) * dy) / L2, 0, 1); if (Math.hypot(ax + t * dx - x, ay + t * dy - y) < R) return false;
          }
        }
        return true;
      });
      if (strokes.length !== before) draw();
      return strokes.length !== before;
    };
    cv.addEventListener('pointerdown', e => {
      if (e.pointerType === 'pen') sawPen = true;
      if (e.pointerType === 'touch' && sawPen) return;
      if (active != null) return;
      active = e.pointerId; try { cv.setPointerCapture(e.pointerId); } catch {}
      const pt = toL(e);

    });

      if (e.pointerId !== active) return;
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];

      for (const ev of evs) { const [x, y] = toL(ev); const p = cur.p; if (Math.hypot(x - p[p.length - 2], y - p[p.length - 1]) > 1.6) p.push(x, y); }
      draw();
    });
    const end = e => {
      if (e.pointerId !== active) return; active = null;
      if (mode === 'eraser') { if (erased) { undo.push(gestureSnap); redo.length = 0; } erased = false; syncTools(); return; }
      if (!cur) return;
      const s = { c: cur.c, w: cur.w, p: rdpFlat(cur.p, .9) };
      cur = null; snap(); strokes.push(s); draw(); syncTools();
    };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
    const finish = (save) => {
      window.removeEventListener('resize', resize); ro && ro.disconnect();
      ov.style.transition = 'opacity .25s, translate .3s'; ov.style.opacity = '0'; ov.style.translate = '0 20px';
      setTimeout(() => ov.remove(), 260); this.ov = null; this._cancel = null;
      if (save) onDone(strokes.length ? { w: 1000, h: 750, s: strokes } : null);
    };
    this._cancel = async () => {
      if (JSON.stringify(strokes) !== start) { const ok = await Sheet.confirm({ title: 'Abandonner ce dessin ?', text: 'Les traits ajoutés depuis l’ouverture seront perdus.', ok: 'Abandonner', danger: true }); if (!ok) return; }
      finish(false);
    };
    ov.addEventListener('click', async e => {
      const sw = e.target.closest('[data-c]'); if (sw) { color = sw.dataset.c; mode = 'pen'; LS.set('pad-color', color); return syncTools(); }
      const sz = e.target.closest('[data-w]'); if (sz) { width = +sz.dataset.w; mode = 'pen'; LS.set('pad-w', width); return syncTools(); }
      const b = e.target.closest('[data-a]'); if (!b) return;
      const a = b.dataset.a;
      if (a === 'done') finish(true);
      if (a === 'cancel') this._cancel();
      if (a === 'eraser') { mode = mode === 'eraser' ? 'pen' : 'eraser'; syncTools(); }
      if (a === 'undo' && undo.length) { redo.push(JSON.stringify(strokes)); strokes = JSON.parse(undo.pop()); draw(); syncTools(); }
      if (a === 'redo' && redo.length) { undo.push(JSON.stringify(strokes)); strokes = JSON.parse(redo.pop()); draw(); syncTools(); }
      if (a === 'clear' && strokes.length) { const ok = await Sheet.confirm({ title: 'Tout effacer ?', text: 'Vous pourrez revenir en arrière avec la flèche.', ok: 'Tout effacer', danger: true }); if (ok) { snap(); strokes = []; draw(); syncTools(); } }
    });
    let ro = null; try { ro = new ResizeObserver(resize); ro.observe(paper); } catch { window.addEventListener('resize', resize); }
    requestAnimationFrame(resize); syncTools();
  },
};

      ${showTimer || showTemp ? `<div class="frow">${showTimer ? `<label class="lbl">Minuteur (min)<input class="field num" id="s-${s.id}-timer" type="number" inputmode="decimal" min="0" step="0.5" data-s="timer" data-n value="${s.timer ?? ''}" placeholder="25"></label>` : ''}${showTemp ? `<label class="lbl">Four (°C)<input class="field num" id="s-${s.id}-temp" type="number" inputmode="numeric" min="0" max="320" step="5" data-s="temp" data-n value="${s.temp ?? ''}" placeholder="180"></label>` : ''}</div>` : ''}

      ${s.drawing || s.image ? `<div class="media">${s.drawing ? `<div class="sk" data-act="draw" role="button" aria-label="Modifier le dessin">${sketchSVG(s.drawing)}<button type="button" data-act="draw-del" aria-label="Retirer le dessin">${ic('close')}</button></div>` : ''}${s.image ? `<div class="sk"><img src="${esc(s.image)}" alt=""><button type="button" data-act="img-del" aria-label="Retirer la photo">${ic('close')}</button></div>` : ''}</div>` : ''}
      <div class="estep-tools">
        <button type="button" class="btn ${s.timer ? 'set' : ''}" data-act="t-timer">${ic('timer')}${s.timer ? fmtDuration(s.timer) : 'Minuteur'}</button>
        <button type="button" class="btn ${s.temp ? 'set' : ''}" data-act="t-temp">${ic('temp')}${s.temp ? s.temp + NB + '°C' : 'Four'}</button>
        <button type="button" class="btn ${s.tip ? 'set' : ''}" data-act="t-tip">${ic('bulb')}Astuce</button>
        <button type="button" class="btn ${s.drawing ? 'set' : ''}" data-act="draw">${ic('draw')}${s.drawing ? 'Dessin' : 'Dessiner'}</button>
        <button type="button" class="btn ${s.image ? 'set' : ''}" data-act="img">${ic('photo')}Photo</button>
      </div></div>`;
  };
  const paintSteps = () => { $('#steps', el).innerHTML = d.steps.map(stepHTML).join(''); };
  const paintStep = (i) => { const old = $(`.estep[data-i="${i}"]`, el); if (old) { const n = frag(stepHTML(d.steps[i], i)); old.replaceWith(n); } };

  paintCover(); paintIngPrev(); paintSteps();
  requestAnimationFrame(() => { segSet('#cat-seg', 'cat', d.category); segSet('#diff-seg', 'd', d.difficulty); });
  const onScroll = () => { const tb = $('#tb', el); if (tb) tb.classList.toggle('scrolled', scrollY > 90); };
  window.addEventListener('scroll', onScroll, { passive: true });

  el.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'ing-ta') {
      d.ingredients = t.value.split('\n').map(l => l.trim()).filter(Boolean).map(l => /:\s*$/.test(l) && !/^\d/.test(l) ? { t: l.replace(/\s*:\s*$/, ''), g: 1 } : { t: l.replace(/^[-–•*·]\s*/, '') });
      paintIngPrev(); $$('.estep', el).forEach(es => { const i = +es.dataset.i; const sg = $('[data-sug]', es); if (sg) sg.innerHTML = suggestHTML(d.steps[i], i); });
      return touch();
    }
    if (t.id === 'eq-ta') { d.equipment = t.value.split('\n').map(l => l.replace(/^[-–•*·]\s*/, '').trim()).filter(Boolean); return touch(); }
    if (t.dataset.k) {
      const k = t.dataset.k; let v = t.value;
      if (t.dataset.n != null) v = v === '' ? 0 : Math.max(0, parseFloat(v) || 0);
      if (k === 'servings') v = clamp(Math.round(v) || 1, 1, 200);
      d[k] = v;
      if (k === 'title') { const tt = $('#tb .title', el); if (tt) tt.textContent = v || 'Nouvelle recette'; if (!d.cover_url) $('#cover-prev', el).innerHTML = coverHTML(d); }
      return touch();
    }
    if (t.dataset.s) {
      const es = t.closest('.estep'); const i = +es.dataset.i; const s = d.steps[i]; const k = t.dataset.s;
      if (t.dataset.n != null) s[k] = t.value === '' ? null : Math.max(0, parseFloat(t.value) || 0) || null; else s[k] = t.value;
      if (k === 'text' || k === 'title') { const sg = $('[data-sug]', es); if (sg) sg.innerHTML = suggestHTML(s, i); }
      if (k === 'timer' || k === 'temp') {
        const b = $(`[data-act="t-${k}"]`, es);
        if (b) { b.classList.toggle('set', !!s[k]); b.innerHTML = k === 'timer' ? `${ic('timer')}${s.timer ? fmtDuration(s.timer) : 'Minuteur'}` : `${ic('temp')}${s.temp ? s.temp + NB + '°C' : 'Four'}`; }

  const autosize = t => { if (t.tagName === 'TEXTAREA') { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 2, 700) + 'px'; } };
  el.addEventListener('input', e => autosize(e.target));

  const setStepImage = async (i) => {
    const file = await pickImage(); if (!file) return;
    const es = $(`.estep[data-i="${i}"]`, el); const b = es && $('[data-act="img"]', es);
    if (b) { b.disabled = true; b.innerHTML = `${ic('sync')}Envoi…`; }

  const doSave = async (force = false) => {
    if (saving) return;
    if (!d.title.trim()) { const t = $('#f-title', el); t.focus(); t.scrollIntoView({ block: 'center', behavior: 'smooth' }); Toast.show('Donnez un nom à la recette'); return; }
    saving = true; const sb = $('#savebtn', el); sb.disabled = true; sb.innerHTML = `${ic('sync')}Enregistrement…`;
    const toSave = clone(d); toSave.steps = toSave.steps.filter(s => (s.text || '').trim() || (s.title || '').trim() || s.drawing || s.image);
    toSave.title = toSave.title.trim();

  const leave = async () => {
    if (dirty) {

  const applyImport = (p) => {
    if (p.title && !d.title) d.title = p.title; else if (p.title && isNew) d.title = p.title;
    if (p.description) d.description = p.description;
    for (const k of ['servings', 'servings_label', 'prep_min', 'cook_min', 'rest_min', 'category']) if (p[k] != null && p[k] !== '') d[k] = p[k];

  const fillForm = () => {
    const set = (sel, v) => { const f = $(sel, el); if (f) f.value = v; };
    set('#f-title', d.title); set('#f-desc', d.description); set('#f-prep', d.prep_min || ''); set('#f-cook', d.cook_min || ''); set('#f-rest', d.rest_min || '');
    set('#f-serv', d.servings); set('#f-servl', d.servings_label); set('#ing-ta', ingText()); set('#eq-ta', d.equipment.join('\n')); set('#f-notes', d.notes);
    const tt = $('#tb .title', el); if (tt) tt.textContent = d.title || 'Nouvelle recette';
    segSet('#cat-seg', 'cat', d.category); segSet('#diff-seg', 'd', d.difficulty);
    paintCover(); paintIngPrev(); paintSteps(); requestAnimationFrame(() => $$('textarea', el).forEach(autosize));
  };

  el.addEventListener('click', async e => {
    const cb = e.target.closest('#cat-seg [data-cat]'); if (cb) { d.category = cb.dataset.cat; segSet('#cat-seg', 'cat', d.category); if (!d.cover_url) $('#cover-prev', el).innerHTML = coverHTML(d); return touch(); }
    const db = e.target.closest('#diff-seg [data-d]'); if (db) { d.difficulty = +db.dataset.d; segSet('#diff-seg', 'd', d.difficulty); return touch(); }
    const a = e.target.closest('[data-act]'); if (!a) return;
    const es = a.closest('.estep'); const i = es ? +es.dataset.i : -1; const s = i >= 0 ? d.steps[i] : null;
    switch (a.dataset.act) {
      case 'cancel': leave(); break;

      case 'cover': {
        const file = await pickImage(); if (!file) return;
        $('#cover-btns', el).innerHTML = `<span class="foot">Envoi de la photo…</span>`;

      }
      case 'cover-del': d.cover_url = null; touch(); paintCover(); break;
      case 'add-step': { d.steps.push(blankStep()); touch(); paintSteps(); const last = $('#steps .estep:last-child textarea', el); if (last) { last.focus(); last.scrollIntoView({ block: 'center', behavior: 'smooth' }); } break; }
      case 't-timer': case 't-temp': case 't-tip': {

        o[k] = s[k] ? true : !o[k];
        paintStep(i); const f = $(`#s-${s.id}-${k}`, el); if (f && o[k]) { f.focus(); autosize(f); } break;
      }
      case 'sug-timer': s.timer = +a.dataset.v; touch(); paintStep(i); break;
      case 'sug-temp': s.temp = +a.dataset.v; touch(); paintStep(i); break;
      case 'draw': Pad.open(s.drawing, dr => { d.steps[i].drawing = dr; touch(); paintStep(i); }); break;
      case 'draw-del': e.stopPropagation(); s.drawing = null; touch(); paintStep(i); break;
      case 'img': setStepImage(i); break;
      case 'img-del': s.image = null; touch(); paintStep(i); break;
      case 'step-menu': {
        const v = await Sheet.actions(`Étape ${i + 1}`, [
          ...(i > 0 ? [{ icon: 'up', label: 'Monter', value: 'up' }] : []),
          ...(i < d.steps.length - 1 ? [{ icon: 'dn', label: 'Descendre', value: 'down' }] : []),
          { icon: 'plus', label: 'Insérer une étape après', value: 'ins' },
          { icon: 'copy', label: 'Dupliquer', value: 'dup' },
          { icon: 'trash', label: 'Supprimer l’étape', value: 'del', danger: true },
        ]);
        if (!v) return;
        if (v === 'up') [d.steps[i - 1], d.steps[i]] = [d.steps[i], d.steps[i - 1]];
        if (v === 'down') [d.steps[i + 1], d.steps[i]] = [d.steps[i], d.steps[i + 1]];
        if (v === 'ins') d.steps.splice(i + 1, 0, blankStep());
        if (v === 'dup') { const c = clone(s); c.id = uid().slice(0, 8); d.steps.splice(i + 1, 0, c); }
        if (v === 'del') { const removed = d.steps.splice(i, 1)[0]; if (!d.steps.length) d.steps.push(blankStep()); Toast.show('Étape supprimée', { action: 'Annuler', onAction: () => { d.steps.splice(i, 0, removed); touch(); paintSteps(); } }); }
        touch(); paintSteps(); break;
      }
      case 'paste': case 'paste-steps': {
        const stepsOnly = a.dataset.act === 'paste-steps';
        const sh = Sheet.open(`<div class="sheet-head"><h2>${stepsOnly ? 'Coller des étapes' : 'Coller une recette'}</h2><button class="icon-btn" data-x aria-label="Fermer">${ic('close')}</button></div>
          <div class="scroll" style="display:grid;gap:12px"><p class="sub">${stepsOnly ? 'Une étape par paragraphe, ou des étapes numérotées (1., 2., …).' : 'Collez tout le texte : titre, ingrédients, préparation. Les titres « Ingrédients » et « Préparation » aident, mais ne sont pas obligatoires.'}</p>
          <textarea class="field" id="paste-ta" rows="12" autofocus placeholder="${stepsOnly ? esc('1. Préchauffez le four à 180 °C.\n2. Mélangez…') : esc('Cookies moelleux\nPour 12 cookies\n\nIngrédients\n125 g de beurre…\n\nPréparation\n1. Fouettez le beurre…')}"></textarea>
          <div id="paste-sum" class="foot"></div>
          <button class="btn btn-primary btn-lg" id="paste-go" disabled>${ic('sparkles')}Ranger dans la recette</button></div>`, { full: true, label: 'Coller' });
        const ta = $('#paste-ta', sh.sheet), go = $('#paste-go', sh.sheet), sum = $('#paste-sum', sh.sheet);
        let parsed = null;
        const upd = () => {
          const v = ta.value.trim(); go.disabled = !v;
          if (!v) { sum.textContent = ''; parsed = null; return; }
          if (stepsOnly) { parsed = splitSteps(v); sum.textContent = `${plural(parsed.length, 'étape reconnue', 'étapes reconnues')}.`; }
          else { parsed = parseRecipeText(v); sum.textContent = `${parsed.title ? `« ${parsed.title} » · ` : ''}${plural(parsed.ingredients.filter(x => !x.g).length, 'ingrédient', 'ingrédients')} · ${plural(parsed.steps.length, 'étape', 'étapes')}`; }
        };
        ta.addEventListener('input', upd);
        sh.sheet.addEventListener('click', ev => {
          if (ev.target.closest('[data-x]')) return sh.close();
          if (ev.target.closest('#paste-go') && parsed) {
            if (stepsOnly) { const keep = d.steps.filter(x => x.text.trim() || x.title.trim() || x.drawing || x.image); d.steps = [...keep, ...parsed]; touch(); sh.close(); paintSteps(); Toast.show(`${plural(parsed.length, 'étape ajoutée', 'étapes ajoutées')}`); }
            else { sh.close(); applyImport(parsed); Toast.show('Recette rangée : vérifiez et complétez'); }
          }
        });
        break;
      }
      case 'delete': {
        const ok = await Sheet.confirm({ title: 'Supprimer cette recette ?', text: 'Elle sera déplacée dans la corbeille : vous pourrez la restaurer.', ok: 'Supprimer', danger: true });
        if (!ok) return;
        try { Router.leaving = true; await Store.remove(id); Router.leaving = false; LS.del(draftKey); dirty = false; Toast.show('Recette déplacée dans la corbeille', { action: 'Annuler', onAction: async () => { await Store.restore(id); Router.go('/r/' + id); } }); Router.go('/', { replace: true }); }
        catch (err) { Router.leaving = false; Toast.show(Store.explain(err)); }
        break;
      }
    }
  });
  return () => { window.removeEventListener('scroll', onScroll); if (dirty) LS.set(draftKey, d); };
};

/* =========================================================================
   Routeur, transitions, parallaxe, « hello » d'ouverture, démarrage
   ========================================================================= */
const SPRING = () => (getComputedStyle(document.documentElement).getPropertyValue('--spring') || '').trim() || 'cubic-bezier(.25,1,.5,1)';

const Router = {
  cur: null, cleanup: null, hist: [], leaving: false, swiped: false, scrollMem: {},
  routes: [
    { re: /^\/?$/, view: 'home', depth: 0 },
    { re: /^\/r\/([\w-]+)$/, view: 'recipe', depth: 1 },
    { re: /^\/r\/([\w-]+)\/cuisine$/, view: 'cook', depth: 2 },
    { re: /^\/r\/([\w-]+)\/modifier$/, view: 'edit', depth: 2 },
    { re: /^\/nouvelle$/, view: 'edit', depth: 1 },
    { re: /^\/corbeille$/, view: 'trash', depth: 1 },
  ],
  path() { const h = location.hash || ''; return h.startsWith('#/') ? decodeURI(h.slice(1)) : '/'; },
  parse(p) { for (const r of this.routes) { const m = p.match(r.re); if (m) return { ...r, path: p, params: m.slice(1) }; } return { ...this.routes[0], path: '/', params: [] }; },
  parent(route) { const r = route || this.cur; if (!r) return '/'; if (r.view === 'cook' || (r.view === 'edit' && r.params[0])) return '/r/' + r.params[0]; return '/'; },
  go(p, { replace = false } = {}) {
    if (p === this.path() && !replace) return;
    try {
      if (replace) history.replaceState({ ss: 1 }, '', '#' + p); else history.pushState({ ss: 1 }, '', '#' + p);
    } catch { location.hash = p; return; }
    if (replace) this.hist[this.hist.length - 1] = p; else this.hist.push(p);
    this.render();
  },
  back(fallback) {
    if (this.hist.length > 1) history.back();
    else this.go(fallback || this.parent(), { replace: true });
  },
  onPop() {
    const p = this.path(); const i = this.hist.lastIndexOf(p);
    if (i >= 0) this.hist.length = i + 1; else this.hist.push(p);
    this.render();
  },
  render(force = false) {
    const route = this.parse(this.path());
    if (!force && this.cur && route.path === this.cur.path) return;
    const prev = this.cur; this.cur = route;
    if (this.cleanup) { try { this.cleanup(); } catch (e) { console.error(e); } this.cleanup = null; }
    Spot.close(); [...Sheet.stack].forEach(s => s.close());
    const dir = !prev || force ? 'none' : route.depth > prev.depth ? 'push' : route.depth < prev.depth ? 'pop' : 'fade';
    if (prev) this.scrollMem[prev.path] = scrollY;
    const old = $('main.view:not(.leaving)');
    const animate = old && dir !== 'none' && !reduceMotion() && !this.swiped;
    if (old) {
      if (animate) {
        const y = scrollY; old.classList.add('leaving'); old.inert = true;
        Object.assign(old.style, { position: 'fixed', top: (-y) + 'px', left: '0', right: '0' });
      } else old.remove();
    }
    this.swiped = false;
    const view = document.createElement('main'); view.className = 'view';
    $('#app').appendChild(view);
    let ret;
    try { ret = (Views[route.view] || Views.home)({ el: view, params: route.params, route }); }
    catch (e) { console.error(e); view.innerHTML = `<div class="wrap narrow"><div class="notfound glass" style="border-radius:var(--r-xl)"><h1 class="title-1">Un souci d’affichage</h1><p class="sub">${esc(e.message || e)}</p><button class="btn btn-primary" onclick="location.hash='#/';location.reload()">Revenir à l’accueil</button></div></div>`; }
    this.cleanup = typeof ret === 'function' ? ret : null;
    window.scrollTo(0, dir === 'pop' ? (this.scrollMem[route.path] || 0) : 0);
    if (animate) {
      const [a, b] = dir === 'push' ? ['enter-push', 'leave-push'] : dir === 'pop' ? ['enter-pop', 'leave-pop'] : ['enter-fade', ''];
      view.classList.add(a); if (b) old.classList.add(b);
      setTimeout(() => { old.remove(); view.classList.remove(a); }, 470);
    }
    const r = route.params[0] ? Store.get(route.params[0]) : null;
    document.title = route.view === 'home' ? 'SimpleSugar' : r ? `${r.title} · SimpleSugar` : route.view === 'trash' ? 'Corbeille · SimpleSugar' : route.view === 'edit' ? 'Nouvelle recette · SimpleSugar' : 'SimpleSugar';
    if (!Timers.list.some(t => t.done)) Timers.title = document.title;
    requestAnimationFrame(() => Parallax.scan());
  },
};

/* ---------- parallaxe douce ---------- */
const Parallax = {
  els: [], mesh: null, ticking: false,
  scan() { this.els = $$('main.view:not(.leaving) [data-depth]'); this.update(); },
  update() {
    this.ticking = false;
    const y = scrollY, H = innerHeight;
    if (this.mesh) this.mesh.style.transform = reduceMotion() ? '' : `translate3d(0,${(-Math.min(y * .12, H * .35)).toFixed(1)}px,0)`;
    if (reduceMotion() || innerWidth < 641) { this.els.forEach(el => el.style.removeProperty('--py')); return; }
    for (const el of this.els) {
      if (!el.isConnected) continue;
      const r = el.getBoundingClientRect(); const py = parseFloat(el.style.getPropertyValue('--py')) || 0;
      const top = r.top - py; if (top > H + 200 || top + r.height < -200) continue;
      const c = top + r.height / 2 - H / 2;
      el.style.setProperty('--py', (-c * parseFloat(el.dataset.depth || 0)).toFixed(1) + 'px');
    }
  },
  on() { if (!this.ticking) { this.ticking = true; requestAnimationFrame(() => this.update()); } },
};
window.addEventListener('scroll', () => Parallax.on(), { passive: true });
window.addEventListener('resize', () => Parallax.on(), { passive: true });

/* ---------- glisser depuis le bord gauche pour revenir (application installée) ---------- */
(function edgeSwipe() {
  let standalone = false;
  try { standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch {}
  if (!standalone) return;
  let x0 = null, y0 = 0, dx = 0, view = null;
  document.addEventListener('touchstart', e => {
    const t = e.touches[0];
    if (t.clientX > 24 || !Router.cur || Router.cur.depth === 0 || Router.cur.view === 'cook' || Sheet.stack.length || Pad.isOpen() || Spot.el) return;
    x0 = t.clientX; y0 = t.clientY; dx = 0; view = $('main.view:not(.leaving)');
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (x0 == null || !view) return; const t = e.touches[0]; dx = t.clientX - x0;
    if (Math.abs(t.clientY - y0) > 50 && dx < 40) { x0 = null; view.style.translate = ''; return; }
    if (dx > 0) { view.style.transition = 'none'; view.style.translate = `${dx}px 0`; }
  }, { passive: true });
  document.addEventListener('touchend', () => {
    if (x0 == null || !view) return; x0 = null;
    const v = view;
    if (dx > innerWidth * .28) { v.style.transition = 'translate .22s ease-out'; v.style.translate = `${innerWidth}px 0`; setTimeout(() => { Router.swiped = true; Router.back(); }, 200); }
    else { v.style.transition = 'translate .35s cubic-bezier(.25,1,.5,1)'; v.style.translate = ''; }
  });
})();

/* ---------- le « hello » d'ouverture ---------- */
const Splash = {
  active: false, want: false,
  prepare() {
    this.want = !IS_PREVIEW_NO_SPLASH && LS.get('hello', true) && !SS.get('hello') && Router.parse(Router.path()).view === 'home' && !reduceMotion();
    SS.set('hello', '1');
    this.active = this.want;
  },
  async run() {
    if (!this.want) return;
    const sp = frag(`<div class="splash" aria-hidden="true"><div class="frost"></div><div class="logo">${Hand.svg('logo', { sw: 60 })}</div><div class="skip">Touchez pour passer</div></div>`);
    document.body.appendChild(sp);
    const svg = $('.logo svg', sp), logo = $('.logo', sp), frost = $('.frost', sp);
    let skipped = false;
    sp.addEventListener('click', () => { skipped = true; (svg._anims || []).forEach(a => { try { a.finish(); } catch {} }); }, { once: true });
    await Hand.play(svg, { duration: 3000, delay: 300 });
    if (!skipped) await sleep(380);
    const skip = $('.skip', sp); if (skip) skip.remove();
    const target = $('main.view:not(.leaving) .hero-logo svg');
    const a = logo.getBoundingClientRect();
    const dur = 1000;
    if (target) {
      const b = target.getBoundingClientRect();
      if (b.bottom > 0 && b.top < innerHeight && a.width) {
        const s = b.width / a.width;
        logo.animate([{ transform: 'translate(0,0) scale(1)' }, { transform: `translate(${b.left - a.left}px, ${b.top - a.top}px) scale(${s})` }], { duration: dur, easing: SPRING(), fill: 'forwards' });
      } else logo.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(-20px) scale(.92)' }], { duration: 500, easing: 'ease', fill: 'forwards' });
    }
    frost.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 760, delay: 140, easing: 'ease', fill: 'forwards' });
    await sleep(dur - 40);
    if (target) target.style.visibility = '';
    this.active = false;
    sp.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' }).finished.then(() => sp.remove()).catch(() => sp.remove());
  },
};

/* ---------- service worker (hors-ligne) ---------- */
function registerSW() {
  if (IS_PREVIEW || !('serviceWorker' in navigator) || location.protocol !== 'https:') return;
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  let done = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!had || done) return; done = true; Toast.show('SimpleSugar a été mis à jour', { action: 'Recharger', onAction: () => location.reload(), ms: 8000 }); });
}

/* ---------- démarrage ---------- */
(async function boot() {
  setTheme(LS.get('theme', 'auto'));
  Parallax.mesh = $('.mesh');
  Router.hist = [Router.path()];
  window.addEventListener('popstate', () => Router.onPop());
  window.addEventListener('hashchange', () => Router.onPop());
  try { await Store.init(); } catch (e) { console.error(e); }
  Splash.prepare();
  Router.render();
  Splash.run();
  registerSW();
  Island.render();
})();

</script>

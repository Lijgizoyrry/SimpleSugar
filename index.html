<style>
/* Layout: Bento grid of frosted-glass modules floating over a slow pastel mesh (iOS 18 / visionOS feel) */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Roboto", "Helvetica Neue", Arial, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Inter", "Roboto", sans-serif;

  --bg: #fbf3f6;
  --orb-1: #ff9cc2; --orb-2: #ffc89c; --orb-3: #c9b6ff; --orb-4: #a9ead9; --orb-5: #ffe49c;
  --veil: rgba(255,255,255,.16);

  --text: #1d1d1f;
  --text-2: #5c5661;
  --text-3: #8f8994;
  --glass: rgba(255,255,255,.40);
  --glass-strong: rgba(255,255,255,.66);
  --glass-solid: rgba(252,248,250,.94);
  --edge-1: rgba(255,255,255,.95);
  --edge-2: rgba(255,255,255,.30);
  --edge-3: rgba(255,255,255,.08);
  --field: rgba(255,255,255,.58);
  --field-focus: rgba(255,255,255,.86);
  --hairline: rgba(60,60,67,.14);
  --shadow: 0 8px 32px 0 rgba(0,0,0,.05), 0 1px 2px 0 rgba(0,0,0,.06);
  --shadow-lift: 0 22px 54px -12px rgba(80,24,52,.20), 0 2px 6px rgba(0,0,0,.06);
  --inner: inset 0 1px 0 rgba(255,255,255,.55);

  --accent: #f0306f;
  --accent-hi: #ff5f92;
  --accent-soft: rgba(240,48,111,.12);
  --on-accent: #ffffff;
  --pat: #f0306f;
  --cui: #f28100;
  --ok: #23a24a;
  --danger: #e5352b;
  --hand-1: #ff2f72; --hand-2: #ff8a3d; --hand-3: #9a68ff;
  --hand-glow: rgba(255,47,114,.18);
  --island: rgba(12,10,14,.94);
  --on-island: #ffffff;
  --scrim: rgba(36,14,28,.20);
  --paper: rgba(255,255,255,.72);
  --paper-dot: rgba(60,60,67,.16);

  --r-sm: 14px; --r-md: 22px; --r-lg: 28px; --r-xl: 34px;
  --gap: 24px;
  --ease: cubic-bezier(.25,1,.5,1);
  --ease-io: cubic-bezier(.45,0,.25,1);
  --spring: cubic-bezier(.25,1,.5,1);
  --safe-t: env(safe-area-inset-top, 0px);
  --isl: 0px; /* hauteur réservée à l'île des minuteurs */
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@supports (transition-timing-function: linear(0, 1)){
  :root{ --spring: linear(0, 0.0256, 0.0914, 0.1831, 0.2891, 0.4001, 0.5095, 0.6123, 0.7055, 0.787, 0.8563, 0.9133, 0.9587, 0.9935, 1.019, 1.0365, 1.0473, 1.0528, 1.0543, 1.0527, 1.049, 1.0439, 1.0381, 1.0321, 1.0261, 1.0206, 1.0156, 1.0112, 1.0075, 1.0045, 1.0021, 1.0002, 0.9989, 0.998, 0.9974, 0.9971, 0.9971, 0.9972, 0.9974, 0.9976, 0.998, 0.9983, 0.9986, 0.9989, 0.9992, 0.9994, 1); }
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: #0c0a10;
    --orb-1: #a3225b; --orb-2: #a5561f; --orb-3: #4f37aa; --orb-4: #0f6a57; --orb-5: #7a6015;
    --veil: rgba(0,0,0,.10);
    --text: #f5f5f7; --text-2: #cbc6d1; --text-3: #8e8895;
    --glass: rgba(30,30,30,.40); --glass-strong: rgba(38,35,42,.70); --glass-solid: rgba(26,24,30,.95);
    --edge-1: rgba(255,255,255,.34); --edge-2: rgba(255,255,255,.10); --edge-3: rgba(255,255,255,.03);
    --field: rgba(255,255,255,.08); --field-focus: rgba(255,255,255,.14);
    --hairline: rgba(235,235,245,.14);
    --shadow: 0 8px 32px 0 rgba(0,0,0,.36), 0 1px 2px 0 rgba(0,0,0,.42);
    --shadow-lift: 0 24px 56px -12px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.4);
    --inner: inset 0 1px 0 rgba(255,255,255,.10);
    --accent: #ff5c90; --accent-hi: #ff86ac; --accent-soft: rgba(255,92,144,.16); --on-accent: #ffffff;
    --pat: #ff6b9b; --cui: #ffa53d; --ok: #3ad46a; --danger: #ff5a4f;
    --hand-1: #ff8fb6; --hand-2: #ffc48e; --hand-3: #c9abff; --hand-glow: rgba(255,143,182,.30);
    --island: rgba(0,0,0,.94); --scrim: rgba(0,0,0,.46);
    --paper: rgba(255,255,255,.06); --paper-dot: rgba(235,235,245,.16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg: #0c0a10;
  --orb-1: #a3225b; --orb-2: #a5561f; --orb-3: #4f37aa; --orb-4: #0f6a57; --orb-5: #7a6015;
  --veil: rgba(0,0,0,.10);
  --text: #f5f5f7; --text-2: #cbc6d1; --text-3: #8e8895;
  --glass: rgba(30,30,30,.40); --glass-strong: rgba(38,35,42,.70); --glass-solid: rgba(26,24,30,.95);
  --edge-1: rgba(255,255,255,.34); --edge-2: rgba(255,255,255,.10); --edge-3: rgba(255,255,255,.03);
  --field: rgba(255,255,255,.08); --field-focus: rgba(255,255,255,.14);
  --hairline: rgba(235,235,245,.14);
  --shadow: 0 8px 32px 0 rgba(0,0,0,.36), 0 1px 2px 0 rgba(0,0,0,.42);
  --shadow-lift: 0 24px 56px -12px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.4);
  --inner: inset 0 1px 0 rgba(255,255,255,.10);
  --accent: #ff5c90; --accent-hi: #ff86ac; --accent-soft: rgba(255,92,144,.16); --on-accent: #ffffff;
  --pat: #ff6b9b; --cui: #ffa53d; --ok: #3ad46a; --danger: #ff5a4f;
  --hand-1: #ff8fb6; --hand-2: #ffc48e; --hand-3: #c9abff; --hand-glow: rgba(255,143,182,.30);
  --island: rgba(0,0,0,.94); --scrim: rgba(0,0,0,.46);
  --paper: rgba(255,255,255,.06); --paper-dot: rgba(235,235,245,.16);
  color-scheme: dark;
}

/* ---------- base ---------- */
*,*::before,*::after{ box-sizing: border-box; }
html{ -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body{
  margin: 0; min-height: 100vh; min-height: 100dvh;
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 17px; line-height: 1.45; font-weight: 400;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
h1,h2,h3,h4{ margin: 0; font-weight: 700; letter-spacing: -0.02em; line-height: 1.12; text-wrap: balance; }
p{ margin: 0; }
a{ color: inherit; text-decoration: none; }
button{ font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input,textarea,select{ font: inherit; color: inherit; }
img{ max-width: 100%; display: block; }
svg{ display: block; }
[hidden]{ display: none !important; }
::selection{ background: var(--accent-soft); }
:focus-visible{ outline: 2.5px solid var(--accent); outline-offset: 3px; border-radius: 12px; }
.sr{ position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num{ font-variant-numeric: tabular-nums; }

/* ---------- mesh gradient behind the glass ---------- */
.mesh{
  position: fixed; left: -12vw; right: -12vw; top: -12vh; height: 150vh; z-index: -2;
  pointer-events: none; overflow: hidden; background: var(--bg);
  will-change: transform; transform: translate3d(0,0,0);
}
.mesh i{
  position: absolute; width: 64vmax; height: 64vmax; border-radius: 50%;
  background: radial-gradient(closest-side, var(--c) 0%, var(--c) 22%, transparent 100%);
  opacity: .82; will-change: transform;
  animation: drift var(--d, 40s) var(--ease-io) infinite alternate;
}
.mesh i:nth-child(1){ --c: var(--orb-1); top: -16vmax; left: -10vmax; --d: 34s; }
.mesh i:nth-child(2){ --c: var(--orb-2); top: 6vh; right: -20vmax; --d: 41s; animation-delay: -9s; }
.mesh i:nth-child(3){ --c: var(--orb-3); top: 52vh; left: 12vw; --d: 47s; animation-delay: -17s; }
.mesh i:nth-child(4){ --c: var(--orb-4); top: 34vh; left: -30vmax; --d: 53s; animation-delay: -4s; opacity: .7; }
.mesh i:nth-child(5){ --c: var(--orb-5); top: 70vh; right: -16vmax; --d: 38s; animation-delay: -23s; opacity: .75; }
.mesh::after{ content: ""; position: absolute; inset: 0; background: var(--veil); }
@keyframes drift{
  0%  { transform: translate3d(0,0,0) scale(1); }
  50% { transform: translate3d(7vmax,5vmax,0) scale(1.14); }
  100%{ transform: translate3d(-5vmax,9vmax,0) scale(.92); }
}
body.calm .mesh i{ animation-play-state: paused; }

/* ---------- glass material ---------- */
.glass{
  position: relative; isolation: isolate;
  background: var(--glass);
  -webkit-backdrop-filter: blur(24px) saturate(150%);
  backdrop-filter: blur(24px) saturate(150%);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow), var(--inner);
}
.glass::before{
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 2;
  background: linear-gradient(135deg, var(--edge-1) 0%, var(--edge-2) 38%, var(--edge-3) 68%, var(--edge-2) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
.glass-strong{ background: var(--glass-strong); }
@supports (corner-shape: squircle){
  .glass, .glass::before, .btn, .field, .chip, .seg, .sheet{ corner-shape: squircle; }
  .glass{ border-radius: calc(var(--r-lg) * 1.45); }
  .sheet{ border-radius: calc(var(--r-xl) * 1.45) calc(var(--r-xl) * 1.45) 0 0; }
}

/* ---------- app shell ---------- */
.app{ min-height: 100vh; min-height: 100dvh; position: relative; overflow-x: clip; }
.view{ position: relative; padding: calc(var(--safe-t) + var(--isl) + 16px) 16px calc(var(--safe-b) + 120px); width: 100%; }
.wrap{ max-width: 1200px; margin: 0 auto; }
.narrow{ max-width: 760px; margin: 0 auto; }
.view.leaving{ position: absolute; inset: 0 0 auto 0; pointer-events: none; }

/* ---------- buttons ---------- */
.btn{
  --h: 46px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: var(--h); padding: 0 20px; border-radius: 999px;
  font-size: 16px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap;
  background: var(--glass-strong); color: var(--text);
  -webkit-backdrop-filter: blur(20px) saturate(150%); backdrop-filter: blur(20px) saturate(150%);
  box-shadow: 0 1px 2px rgba(0,0,0,.06), var(--inner), 0 0 0 1px var(--hairline) inset;
  transition: scale .22s var(--ease), background-color .2s ease, opacity .2s ease;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.btn:active{ scale: .96; }
.btn svg{ width: 20px; height: 20px; flex: none; }
.btn-primary{
  color: var(--on-accent);
  background: linear-gradient(180deg, var(--accent-hi), var(--accent));
  box-shadow: 0 10px 24px -8px var(--accent), inset 0 1px 0 rgba(255,255,255,.35);
}
.btn-lg{ --h: 56px; font-size: 17px; padding: 0 26px; }
.btn-sm{ --h: 36px; font-size: 14px; padding: 0 14px; }
.btn-ghost{ background: transparent; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; color: var(--accent); }
.btn-danger{ color: var(--danger); }
.btn[disabled]{ opacity: .45; pointer-events: none; }
.icon-btn{
  width: 44px; height: 44px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
  background: var(--glass-strong);
  -webkit-backdrop-filter: blur(20px) saturate(150%); backdrop-filter: blur(20px) saturate(150%);
  box-shadow: 0 1px 2px rgba(0,0,0,.06), var(--inner), 0 0 0 1px var(--hairline) inset;
  transition: scale .22s var(--ease), background-color .2s ease;
  touch-action: manipulation;
}
.icon-btn:active{ scale: .9; }
.icon-btn svg{ width: 22px; height: 22px; }
.icon-btn.on{ color: var(--accent); }
.ico{ width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico.fill{ fill: currentColor; stroke: none; }

/* ---------- typography helpers ---------- */
.large-title{ font-size: clamp(32px, 7.2vw, 46px); font-weight: 700; letter-spacing: -0.025em; line-height: 1.04; }
.title-1{ font-size: 28px; font-weight: 700; letter-spacing: -0.022em; }
.title-2{ font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.headline{ font-size: 17px; font-weight: 600; letter-spacing: -0.015em; }
.sub{ color: var(--text-2); font-size: 15px; }
.foot{ color: var(--text-3); font-size: 13px; }
.eyebrow{ font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; }
.dot{ width: 8px; height: 8px; border-radius: 50%; background: var(--pat); flex: none; }
.dot.cui{ background: var(--cui); }

/* ---------- bento grid ---------- */
.bento{
  display: grid; gap: var(--gap);
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-auto-rows: 196px; grid-auto-flow: dense;
}
.w2{ grid-column: span 2; }
.h2{ grid-row: span 2; }
.tile{
  padding: 24px; overflow: hidden; display: flex; flex-direction: column; min-width: 0;
  transition: scale .6s var(--ease), box-shadow .6s var(--ease);
  translate: 0 var(--py, 0px);
}
.tile.tap{ cursor: pointer; }
.tile.tap:active{ scale: .985; }
@media (hover: hover) and (pointer: fine){
  .tile:hover{ scale: 1.02; box-shadow: var(--shadow-lift), var(--inner); z-index: 1; }
  .rcard:hover{ scale: 1.02; box-shadow: var(--shadow-lift), var(--inner); z-index: 1; }
}
@media (max-width: 980px){
  .bento{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px){
  :root{ --gap: 16px; }
  .bento{ grid-template-columns: minmax(0, 1fr); grid-auto-rows: auto; }
  .w2, .h2{ grid-column: auto; grid-row: auto; }
  .tile{ min-height: var(--mh, 128px); padding: 22px; }
}

/* ---------- home ---------- */
.hero{ justify-content: space-between; gap: 10px; --mh: 300px; }
.hero-top{ display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hero-logo{ width: 100%; flex: 1; display: grid; place-items: center; min-height: 120px; }
.hero-logo svg{ width: 100%; max-width: 560px; height: auto; overflow: visible; }
.hero-sub{ font-size: 17px; color: var(--text-2); max-width: 34ch; }
.hero-stats{ display: flex; flex-wrap: wrap; gap: 8px; }
.sync-pill{
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 10px; border-radius: 999px;
  font-size: 13px; font-weight: 600; color: var(--text-2); background: var(--field);
  box-shadow: 0 0 0 1px var(--hairline) inset; transition: scale .2s var(--ease);
}
.sync-pill:active{ scale: .95; }
.sync-pill .ico{ width: 17px; height: 17px; }
.sync-pill.spin .ico{ animation: spin 1s linear infinite; }
@keyframes spin{ to{ rotate: 360deg; } }

.chip{
  display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 999px;
  font-size: 14px; font-weight: 600; color: var(--text); background: var(--field);
  box-shadow: 0 0 0 1px var(--hairline) inset; white-space: nowrap;
  transition: scale .2s var(--ease), background-color .2s ease;
}
button.chip:active{ scale: .95; }
.chip .ico{ width: 16px; height: 16px; }
.chip.on{ background: var(--accent); color: var(--on-accent); box-shadow: none; }
.chip.soft{ color: var(--text-2); font-weight: 500; }
.chips{ display: flex; flex-wrap: wrap; gap: 8px; }

.feat{ padding: 0; color: var(--text); }
.feat-cover{ position: absolute; inset: 0; z-index: -1; overflow: hidden; border-radius: inherit; }
.feat-cover .art .art-sketch{ top: 7%; bottom: auto; height: 46%; left: 12%; width: 76%; }
.feat-cover .art .art-ico{ top: 14%; bottom: auto; left: 50%; right: auto; translate: -50% 0; width: 22%; max-width: 92px; }
.feat-body{
  margin: auto 10px 10px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px;
  border-radius: calc(var(--r-lg) - 10px); background: var(--glass-strong);
  -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
  box-shadow: var(--inner), 0 10px 30px -12px rgba(60,20,40,.22);
}
.feat h2{ font-size: clamp(25px, 3vw, 32px); }
.feat-meta{ display: flex; flex-wrap: wrap; gap: 8px; }
.feat-actions{ display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.feat-top{ position: absolute; top: 14px; right: 14px; display: flex; gap: 8px; }
@media (max-width: 640px){ .feat{ --mh: 420px; } }

.progress{ height: 6px; border-radius: 99px; background: var(--hairline); overflow: hidden; }
.progress > i{ display: block; height: 100%; border-radius: inherit; background: var(--accent); width: var(--p, 0%); transition: width .6s var(--ease); }

.search-tile{ gap: 14px; justify-content: center; }
.fake-search{
  display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 18px; border-radius: 18px;
  background: var(--field); box-shadow: 0 0 0 1px var(--hairline) inset; color: var(--text-3); font-size: 17px; text-align: left; width: 100%;
  transition: scale .22s var(--ease), background-color .2s;
}
.fake-search:active{ scale: .98; }
.fake-search kbd{ margin-left: auto; font: 600 12px var(--font); color: var(--text-3); border: 1px solid var(--hairline); border-radius: 7px; padding: 2px 6px; }

.cats{ padding: 10px; flex-direction: row; gap: 10px; }
.cat{
  flex: 1; min-width: 0; border-radius: calc(var(--r-lg) - 8px); padding: 16px; display: flex; flex-direction: column; justify-content: space-between; text-align: left;
  background: var(--field); box-shadow: 0 0 0 1px var(--hairline) inset; transition: scale .25s var(--ease), background-color .2s;
  position: relative; overflow: hidden;
}
.cat:active{ scale: .97; }
.cat .ico-wrap{ width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: #fff; background: linear-gradient(180deg, color-mix(in srgb, var(--k) 78%, #fff), var(--k)); box-shadow: 0 8px 18px -8px var(--k); }
.cat .ico-wrap .ico{ width: 24px; height: 24px; }
.cat b{ font-size: 18px; letter-spacing: -0.015em; display: block; }
.cat span{ font-size: 14px; color: var(--text-2); }
.cat.on{ background: var(--accent-soft); box-shadow: 0 0 0 1.5px var(--k) inset; }
@media (max-width: 640px){ .cats{ --mh: 0px; } .cat{ min-height: 132px; } }

.timer-tile{ gap: 12px; justify-content: space-between; }
.timer-tile .tt-head{ display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.timer-tile .presets{ display: flex; gap: 8px; flex-wrap: wrap; }
.timer-tile .preset{ min-width: 54px; justify-content: center; font-family: var(--font-round); }
.timer-live{ display: flex; align-items: center; gap: 12px; }

.mini{ justify-content: space-between; text-align: left; }

/* segmented control */

/* recipe cards */

.rcard{

}

.rcard .fav{ position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgba(0,0,0,.18); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); transition: scale .2s var(--ease); }

  .rcard .fav{ position: static; margin-right: 12px; color: var(--text-3); background: var(--field); }

}

.art{ position: absolute; inset: 0; background-size: cover; background-position: center; container-type: size; }

.empty{ text-align: center; padding: 40px 20px; display: grid; justify-items: center; gap: 14px; }

/* ---------- top bar ---------- */

  margin-bottom: 18px; pointer-events: none;
}

.topbar::before{
  content: ""; position: absolute; z-index: -1; left: 50%; width: 100vw; translate: -50% 0;
  top: calc(-1 * (var(--safe-t) + var(--isl) + 10px)); bottom: -10px; pointer-events: none;
  background: var(--glass-strong); -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%);

  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.topbar.scrolled .title{ opacity: 1; translate: 0 0; }
.topbar .spacer{ flex: 1; }
.topbar .group{ display: flex; gap: 8px; }

/* ---------- recipe page ---------- */
.r-hero{ display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: var(--gap); align-items: stretch; }
@media (max-width: 860px){ .r-hero{ grid-template-columns: minmax(0,1fr); } }
.r-cover{ position: relative; border-radius: var(--r-xl); overflow: hidden; min-height: 280px; aspect-ratio: 4 / 3; max-width: 100%; box-shadow: var(--shadow-lift); }
.r-cover img{ position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.r-info{ padding: 28px; display: flex; flex-direction: column; gap: 16px; justify-content: center; }
.r-info .desc{ color: var(--text-2); font-size: 17px; }
.r-facts{ display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
.fact{ padding: 12px 14px; border-radius: 18px; background: var(--field); box-shadow: 0 0 0 1px var(--hairline) inset; display: grid; gap: 2px; }
.fact .ico{ width: 18px; height: 18px; color: var(--accent); }
.fact b{ font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.fact span{ font-size: 12px; color: var(--text-2); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.diff{ display: inline-flex; gap: 3px; align-items: flex-end; height: 14px; }
.diff i{ width: 5px; border-radius: 2px; background: var(--text-3); opacity: .35; }
.diff i:nth-child(1){ height: 6px; } .diff i:nth-child(2){ height: 10px; } .diff i:nth-child(3){ height: 14px; }
.diff i.on{ background: var(--accent); opacity: 1; }
.r-cta{ display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.r-bento{ display: grid; gap: var(--gap); grid-template-columns: minmax(0, 1fr) minmax(0, 1.45fr); margin-top: var(--gap); align-items: start; }
@media (max-width: 860px){ .r-bento{ grid-template-columns: minmax(0,1fr); } }
.r-col{ display: grid; gap: var(--gap); align-content: start; min-width: 0; }
.panel{ padding: 24px; min-width: 0; }
.panel-head{ display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.panel-head h2{ font-size: 22px; }

.stepper{ display: inline-flex; align-items: center; gap: 4px; padding: 3px; border-radius: 999px; background: var(--field); box-shadow: 0 0 0 1px var(--hairline) inset; }
.stepper button{ width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; transition: scale .2s var(--ease), background-color .2s; }
.stepper button:active{ scale: .86; background: var(--glass-strong); }
.stepper button .ico{ width: 18px; height: 18px; }
.stepper output{ min-width: 64px; text-align: center; font-weight: 650; font-variant-numeric: tabular-nums; font-size: 15px; }

.ing-group{ margin-top: 14px; }
.ing-group:first-child{ margin-top: 0; }
.ing-group h4{ font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); font-weight: 650; margin: 0 0 6px 2px; }
.ing-list{ list-style: none; margin: 0; padding: 0; display: grid; }
.ing{
  display: grid; grid-template-columns: 26px minmax(64px, auto) minmax(0, 1fr); align-items: baseline; gap: 10px; padding: 10px 4px;
  border-bottom: 1px solid var(--hairline); cursor: pointer; user-select: none; -webkit-user-select: none;
}
.ing:last-child{ border-bottom: 0; }
.ing .box{ width: 22px; height: 22px; border-radius: 50%; box-shadow: 0 0 0 1.6px var(--text-3) inset; display: grid; place-items: center; align-self: center; transition: background-color .25s, box-shadow .25s, scale .25s var(--spring); }
.ing .box .ico{ width: 14px; height: 14px; color: #fff; stroke-width: 3; opacity: 0; transition: opacity .2s; }
.ing .q{ font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ing .n{ min-width: 0; }
.ing.done .box{ background: var(--ok); box-shadow: none; scale: 1.06; }
.ing.done .box .ico{ opacity: 1; }
.ing.done .q, .ing.done .n{ color: var(--text-3); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.ing.noq{ grid-template-columns: 26px minmax(0,1fr); }

.equip{ list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }

.steps-list{ list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.step-row{
  display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 14px; align-items: start; padding: 14px; border-radius: 20px; text-align: left; width: 100%;
  background: var(--field); box-shadow: 0 0 0 1px var(--hairline) inset; transition: scale .25s var(--ease), background-color .2s;
}
.step-row:active{ scale: .985; }
.step-row .n{ width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-round); font-weight: 700; font-size: 18px; color: var(--accent); background: var(--accent-soft); }
.step-row .t b{ display: block; font-size: 17px; letter-spacing: -0.012em; margin-bottom: 2px; }
.step-row .t p{ color: var(--text-2); font-size: 15px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.step-row .flags{ display: flex; gap: 6px; color: var(--text-3); padding-top: 4px; }
.step-row .flags .ico{ width: 18px; height: 18px; }
.step-row .thumb{ width: 72px; aspect-ratio: 4/3; border-radius: 12px; background: var(--paper); overflow: hidden; }
.step-row .thumb svg{ width: 100%; height: 100%; }
.step-row .thumb img{ width: 100%; height: 100%; object-fit: cover; }
.notes{ white-space: pre-wrap; color: var(--text-2); }

.dock{
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 12px 16px calc(var(--safe-b) + 12px); display: flex; justify-content: center; pointer-events: none;
}
.dock > *{ pointer-events: auto; }
.dock .btn-lg{ width: min(520px, 100%); box-shadow: 0 16px 40px -12px var(--accent), inset 0 1px 0 rgba(255,255,255,.35); }

/* ---------- cooking mode ---------- */
.view.cook-view{ padding: 0; }
.cook{ --fs: 21px; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: calc(var(--safe-t) + var(--isl) + 10px) 16px 0; }
body.island-on{ --isl: 50px; }
.cook[data-size="1"]{ --fs: 24px; }
.cook[data-size="2"]{ --fs: 28px; }
.cook-top{ display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px; align-items: center; max-width: 760px; width: 100%; margin: 0 auto; }
.cook-title{ text-align: center; min-width: 0; }
.cook-title b{ display: block; font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cook-title span{ font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.bars{ display: flex; gap: 4px; max-width: 760px; width: 100%; margin: 12px auto 0; }
.bars i{ flex: 1; height: 5px; border-radius: 9px; background: var(--hairline); overflow: hidden; position: relative; }
.bars i::after{ content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--accent); scale: 0 1; transform-origin: left; transition: scale .5s var(--ease); }
.bars i.done::after{ scale: 1 1; }
.bars i.cur::after{ scale: .45 1; opacity: .55; }
.stage{ flex: 1; display: grid; place-items: center; padding: 18px 0 8px; overflow-x: hidden; overflow-x: clip; overflow-y: visible; position: relative; max-width: 760px; width: 100%; margin: 0 auto; touch-action: pan-y; cursor: pointer; }
.card{
  width: 100%; padding: 30px; display: flex; flex-direction: column; gap: 18px; border-radius: var(--r-xl);
  transition: scale .2s var(--ease);
}
.card.pressed{ scale: .985; }
.card .num-big{ font-family: var(--font-round); font-weight: 700; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 10px; }
.card .num-big b{ font-size: 44px; letter-spacing: -0.03em; line-height: .9; color: var(--text); }
.card h2{ font-size: calc(var(--fs) * 1.35); letter-spacing: -0.022em; }
.card .txt{ font-size: var(--fs); line-height: 1.5; }
.card .txt .dur{ display: inline-flex; align-items: baseline; gap: 4px; padding: 0 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 650; cursor: pointer; white-space: nowrap; }
.card .txt .dur .ico{ width: .8em; height: .8em; align-self: center; }
.card .ings{ display: flex; flex-wrap: wrap; gap: 8px; }
.card .ings .chip{ font-size: calc(var(--fs) * .72); min-height: 38px; padding: 0 14px; }
.card .ings .chip b{ font-variant-numeric: tabular-nums; }
.tip{ display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 10px; padding: 14px 16px; border-radius: 18px; background: color-mix(in srgb, var(--hand-2) 16%, transparent); font-size: calc(var(--fs) * .82); }
.tip .ico{ color: var(--hand-2); width: 24px; height: 24px; }
.sketch-box{ border-radius: 22px; background: var(--paper); box-shadow: 0 0 0 1px var(--hairline) inset; overflow: hidden; width: 100%; max-width: 560px; align-self: center; }
.sketch-box svg{ width: 100%; height: auto; }
.photo-box img{ border-radius: 22px; width: 100%; max-height: 52vh; object-fit: cover; }
.card-actions{ display: flex; flex-wrap: wrap; gap: 10px; }
.temp{ display: inline-flex; align-items: center; gap: 6px; }
.cook-bottom{
  position: sticky; bottom: 0; z-index: 5; max-width: 760px; width: 100%; margin: 0 auto;
  display: grid; grid-template-columns: auto minmax(0,1fr); gap: 8px 12px; align-items: center;
  padding: 8px 0 calc(var(--safe-b) + 14px);
}
.cook-bottom::before{ content: ""; position: absolute; top: -26px; bottom: 0; left: 50%; width: 100vw; translate: -50% 0; z-index: -1; pointer-events: none;
  background: color-mix(in srgb, var(--bg) 62%, transparent);
  -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%);
  -webkit-mask-image: linear-gradient(to top, #000 72%, transparent); mask-image: linear-gradient(to top, #000 72%, transparent);
}
.cook-bottom .hint{ grid-column: 1 / -1; }
.cook-bottom #nextbtn{ width: 100%; }
.cook-bottom #prevbtn{ width: 64px; padding: 0; }
.hint{ text-align: center; color: var(--text-3); font-size: 14px; font-weight: 500; animation: breathe 2.6s var(--ease-io) infinite; }
@keyframes breathe{ 50%{ opacity: .45; } }

.mise .ing-list{ font-size: calc(var(--fs) * .86); }
.finish{ text-align: center; align-items: center; }
.finish svg.hand{ width: min(560px, 92%); height: auto; overflow: visible; }

/* ---------- timers: dynamic island ---------- */
.island{
  position: fixed; z-index: 90; top: calc(var(--safe-t) + 8px); left: 50%; translate: -50% 0;
  min-width: 128px; max-width: calc(100vw - 24px); padding: 7px 8px 7px 12px; border-radius: 999px;
  background: var(--island); color: var(--on-island); display: flex; align-items: center; gap: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25); font-size: 15px; font-weight: 600;
  transition: border-radius .5s var(--spring), padding .5s var(--spring), scale .3s var(--ease);
  animation: islandIn .6s var(--spring);
}
@keyframes islandIn{ from{ scale: .4 .6; opacity: 0; } to{ scale: 1; opacity: 1; } }
.island:active{ scale: .97; }
.island .ring{ width: 26px; height: 26px; flex: none; }
.island .t{ font-family: var(--font-round); font-variant-numeric: tabular-nums; font-size: 17px; }
.island .lbl{ color: rgba(255,255,255,.7); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 42vw; }
.island.alarm{ background: linear-gradient(180deg, #ff4f7d, #ff2d55); animation: islandIn .6s var(--spring), ring 1.2s ease-in-out infinite; }
@keyframes ring{ 0%,100%{ rotate: 0deg; } 10%{ rotate: -3deg; } 20%{ rotate: 3deg; } 30%{ rotate: -2deg; } 40%{ rotate: 0deg; } }
.island.open{ border-radius: 28px; flex-direction: column; align-items: stretch; padding: 14px; width: min(380px, calc(100vw - 24px)); }
.island .rows{ display: grid; gap: 10px; }
.island .row{ display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; align-items: center; }
.island .row .t{ font-size: 26px; font-weight: 600; }
.island .row .lbl{ max-width: none; font-size: 14px; }
.island .row .ctl{ display: flex; gap: 6px; }
.island .row .ctl button{ width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.14); }
.island .row .ctl button .ico{ width: 18px; height: 18px; }
.island .row.done .t{ color: #ff8fab; }

/* ---------- sheets & overlays ---------- */
.overlay{ position: fixed; inset: 0; z-index: 80; display: flex; align-items: flex-end; justify-content: center; }
.overlay .scrim{ position: absolute; inset: 0; background: var(--scrim); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); animation: fadeIn .35s ease; }
.overlay.closing .scrim{ animation: fadeOut .3s ease forwards; }
.sheet{
  position: relative; width: min(680px, 100%); max-height: calc(100dvh - var(--safe-t) - var(--isl) - 18px); display: flex; flex-direction: column;
  border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 10px 20px calc(var(--safe-b) + 20px);
  background: var(--glass-strong); -webkit-backdrop-filter: blur(40px) saturate(170%); backdrop-filter: blur(40px) saturate(170%);
  box-shadow: 0 -10px 40px rgba(0,0,0,.14), var(--inner);
  animation: sheetIn .55s var(--spring); overflow: hidden;
}
.overlay.closing .sheet{ animation: sheetOut .3s var(--ease) forwards; }
.sheet .grab{ width: 38px; height: 5px; border-radius: 9px; background: var(--text-3); opacity: .45; margin: 0 auto 12px; flex: none; }
.sheet .sheet-head{ display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex: none; }
.sheet .sheet-head h2{ font-size: 22px; }
.sheet .scroll{ overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; margin: 0 -20px; padding: 0 20px 6px; flex: 1; min-height: 0; }
.sheet.full{ height: calc(100dvh - var(--safe-t) - var(--isl) - 18px); }
@media (min-width: 760px){
  .overlay{ align-items: center; padding: 24px; }
  .sheet{ border-radius: var(--r-xl); padding-bottom: 22px; max-height: min(86vh, 900px); }
  .sheet.full{ height: min(86vh, 900px); }
  .sheet .grab{ display: none; }
}
@keyframes sheetIn{ from{ translate: 0 100%; } to{ translate: 0 0; } }
@keyframes sheetOut{ to{ translate: 0 110%; } }
@media (min-width: 760px){
  @keyframes sheetIn{ from{ translate: 0 40px; opacity: 0; scale: .96; } to{ translate: 0 0; opacity: 1; scale: 1; } }
  @keyframes sheetOut{ to{ translate: 0 30px; opacity: 0; scale: .97; } }
}
@keyframes fadeIn{ from{ opacity: 0; } }
@keyframes fadeOut{ to{ opacity: 0; } }

.list{ display: grid; border-radius: 20px; background: var(--field); box-shadow: 0 0 0 1px var(--hairline) inset; overflow: hidden; }
.list > *{ display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 52px; border-bottom: 1px solid var(--hairline); text-align: left; width: 100%; }
.list > *:last-child{ border-bottom: 0; }
.list > button:active{ background: var(--field-focus); }
.list .ico{ color: var(--text-2); flex: none; }
.list .grow{ flex: 1; min-width: 0; }
.list .grow small{ display: block; color: var(--text-2); font-size: 13px; }
.list-title{ font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); margin: 22px 6px 8px; }
.list-title:first-child{ margin-top: 4px; }

.actions{ display: grid; gap: 10px; }
.actions .btn{ width: 100%; }
.confirm p{ color: var(--text-2); margin-bottom: 16px; }

/* toast */
.toasts{ position: fixed; z-index: 95; left: 50%; translate: -50% 0; bottom: calc(var(--safe-b) + 92px); display: grid; gap: 8px; justify-items: center; pointer-events: none; width: min(460px, calc(100vw - 32px)); }
.toast{
  pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 18px; border-radius: 22px; font-size: 15px; font-weight: 550;
  background: var(--island); color: var(--on-island); box-shadow: 0 12px 30px rgba(0,0,0,.22);
  animation: toastIn .5s var(--spring);
}
.toast.out{ animation: toastOut .3s var(--ease) forwards; }
.toast button{ color: #ff8fb0; font-weight: 700; padding: 6px 10px; border-radius: 12px; }
@keyframes toastIn{ from{ translate: 0 24px; opacity: 0; scale: .96; } }
@keyframes toastOut{ to{ translate: 0 16px; opacity: 0; } }

/* spotlight */
.spot{ position: fixed; inset: 0; z-index: 85; display: flex; justify-content: center; align-items: flex-start; padding: calc(var(--safe-t) + var(--isl) + 12px) 12px 12px; }
.spot .scrim{ position: absolute; inset: 0; background: var(--scrim); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); animation: fadeIn .3s ease; }
.spot-panel{ position: relative; width: min(680px, 100%); max-height: calc(100dvh - var(--safe-t) - var(--isl) - 24px); display: flex; flex-direction: column; padding: 10px; border-radius: 30px; animation: spotIn .5s var(--spring); }
@keyframes spotIn{ from{ translate: 0 -16px; scale: .97; opacity: 0; } }
.spot-input{ display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px; height: 56px; }
.spot-input input{ flex: 1; border: 0; outline: 0; background: transparent; font-size: 20px; font-weight: 500; min-width: 0; }
.spot-input .ico{ color: var(--text-3); }
.spot-results{ overflow-y: auto; overscroll-behavior: contain; display: grid; gap: 4px; padding: 4px 2px 6px; }
.spot-chips{ padding: 4px 8px 10px; }
.hit{ display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 8px; border-radius: 18px; text-align: left; width: 100%; transition: background-color .15s; }
.hit:hover, .hit.sel{ background: var(--field); }
.hit .mini-cover{ width: 52px; height: 52px; border-radius: 14px; position: relative; overflow: hidden; }
.hit b{ display: block; font-size: 16px; }
.hit small{ display: block; color: var(--text-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hit mark{ background: var(--accent-soft); color: inherit; border-radius: 4px; padding: 0 2px; }

/* ---------- forms / editor ---------- */
.form{ display: grid; gap: var(--gap); }
.fsec{ padding: 22px; display: grid; gap: 16px; }
.fsec > h2{ font-size: 20px; display: flex; align-items: center; gap: 10px; }
.fsec > h2 .ico{ color: var(--accent); }
.fsec .help{ color: var(--text-2); font-size: 14px; margin-top: -8px; }
.frow{ display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.lbl{ display: grid; gap: 6px; font-size: 13px; font-weight: 650; color: var(--text-2); letter-spacing: .01em; min-width: 0; }
.field{
  width: 100%; min-height: 48px; padding: 12px 14px; border: 0; border-radius: var(--r-sm); background: var(--field); color: var(--text);
  box-shadow: 0 0 0 1px var(--hairline) inset; font-size: 17px; font-weight: 400; outline: none; transition: box-shadow .2s, background-color .2s;
  -webkit-appearance: none; appearance: none;
}
.field:focus{ background: var(--field-focus); box-shadow: 0 0 0 2px var(--accent) inset; }
.field::placeholder{ color: var(--text-3); }
textarea.field{ resize: vertical; min-height: 96px; line-height: 1.45; }
.field.title-input{ font-size: 26px; font-weight: 700; letter-spacing: -0.02em; min-height: 58px; }
.inline{ display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.parsed{ display: flex; flex-wrap: wrap; gap: 6px; }
.parsed .chip{ font-weight: 500; min-height: 28px; font-size: 13px; }
.parsed .chip b{ font-weight: 700; }
.parsed .chip.grp{ background: transparent; box-shadow: none; color: var(--text-2); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 12px; padding: 0 4px; }
.cover-pick{ display: grid; grid-template-columns: 120px minmax(0,1fr); gap: 14px; align-items: center; }
.cover-pick .prev{ width: 120px; aspect-ratio: 4/3; border-radius: 16px; position: relative; overflow: hidden; background: var(--field); }
.cover-pick .prev img{ width: 100%; height: 100%; object-fit: cover; }
.estep{ padding: 18px; border-radius: 24px; background: var(--field); box-shadow: 0 0 0 1px var(--hairline) inset; display: grid; gap: 12px; }
.estep-head{ display: flex; align-items: center; gap: 10px; }
.estep-head .n{ width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-family: var(--font-round); font-weight: 700; flex: none; }
.estep-head .field{ flex: 1; min-width: 0; }
.estep-tools{ display: flex; gap: 6px; flex-wrap: wrap; }
.estep-tools .btn{ --h: 38px; font-size: 14px; padding: 0 12px; }
.estep-tools .btn.set{ color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent) inset; }
.mini-num{ width: 92px; }
.estep .media{ display: flex; gap: 10px; flex-wrap: wrap; }
.estep .media .sk{ width: 150px; aspect-ratio: 4/3; border-radius: 14px; background: var(--paper); overflow: hidden; position: relative; box-shadow: 0 0 0 1px var(--hairline) inset; }
.estep .media .sk svg, .estep .media .sk img{ width: 100%; height: 100%; object-fit: cover; }
.estep .media .sk button{ position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.45); color: #fff; }
.estep .media .sk button .ico{ width: 16px; height: 16px; }
.suggest{ display: flex; flex-wrap: wrap; gap: 6px; }
.suggest .chip{ font-size: 13px; min-height: 30px; color: var(--accent); background: var(--accent-soft); box-shadow: none; }
.savebar{
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px 16px calc(var(--safe-b) + 10px); display: flex; justify-content: center; pointer-events: none;
}
.savebar .inner{ pointer-events: auto; width: min(760px, 100%); display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 999px; }
.savebar .inner .btn{ flex: 1; }
.savebar .inner .state{ font-size: 13px; color: var(--text-2); padding: 0 8px; white-space: nowrap; }

/* drawing pad */
.pad{ position: fixed; inset: 0; z-index: 88; display: flex; flex-direction: column; background: var(--bg); padding: calc(var(--safe-t) + var(--isl) + 10px) 12px calc(var(--safe-b) + 12px); gap: 12px; animation: padIn .5s var(--spring); }
@keyframes padIn{ from{ translate: 0 30px; opacity: 0; } }
.pad .mesh-lite{ position: absolute; inset: 0; z-index: -1; background: radial-gradient(60% 50% at 20% 10%, var(--orb-1), transparent 70%), radial-gradient(50% 50% at 90% 30%, var(--orb-3), transparent 70%), radial-gradient(60% 50% at 50% 100%, var(--orb-2), transparent 70%), var(--bg); opacity: .9; }
.pad-top{ display: flex; align-items: center; gap: 10px; max-width: 1000px; width: 100%; margin: 0 auto; }
.pad-top h2{ flex: 1; font-size: 19px; text-align: center; }
.pad-canvas{ flex: 1; min-height: 0; display: grid; place-items: center; }
.pad-canvas .paper{ position: relative; width: min(100%, calc((100dvh - var(--safe-t) - var(--isl) - var(--safe-b) - 200px) * 4 / 3)); aspect-ratio: 4 / 3; max-width: 1000px; border-radius: 26px; overflow: hidden; touch-action: none;
  background-color: var(--paper); background-image: radial-gradient(var(--paper-dot) 1.2px, transparent 1.3px); background-size: 22px 22px; box-shadow: var(--shadow), 0 0 0 1px var(--hairline) inset; }
.pad-canvas canvas{ position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.pad-tools{ max-width: 1000px; width: 100%; margin: 0 auto; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 8px; border-radius: 30px; }
.swatch{ width: 34px; height: 34px; border-radius: 50%; background: var(--sw); box-shadow: 0 0 0 2px var(--glass-strong), 0 0 0 1px var(--hairline); transition: scale .2s var(--spring), box-shadow .2s; flex: none; }
.swatch.ink{ background: var(--text); }
.swatch.on{ scale: 1.12; box-shadow: 0 0 0 3px var(--glass-strong), 0 0 0 5px var(--accent); }
.size-dot{ width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; }
.size-dot i{ width: var(--d); height: var(--d); border-radius: 50%; background: var(--text); }
.size-dot.on{ background: var(--field); box-shadow: 0 0 0 2px var(--accent) inset; }
.tool-sep{ width: 1px; height: 26px; background: var(--hairline); }
.icon-btn.sel{ background: var(--accent); color: var(--on-accent); }

/* ---------- splash: the "hello" ---------- */
.splash{ position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; cursor: pointer; }
.splash .frost{ position: absolute; inset: 0; background: color-mix(in srgb, var(--bg) 80%, transparent); -webkit-backdrop-filter: blur(40px) saturate(160%); backdrop-filter: blur(40px) saturate(160%); }
.splash .logo{ position: relative; width: min(84vw, 760px); transform-origin: 0 0; }
.splash .logo svg{ width: 100%; height: auto; overflow: visible; }
.splash .skip{ position: absolute; bottom: calc(var(--safe-b) + 28px); left: 0; right: 0; text-align: center; font-size: 14px; color: var(--text-3); opacity: 0; animation: fadeIn 1s ease 1.6s forwards; }
svg.hand{ overflow: visible; }
svg.hand .ink{ fill: none; stroke-linecap: round; stroke-linejoin: round; }
svg.hand.glow{ filter: drop-shadow(0 6px 14px var(--hand-glow)); }

/* ---------- view transitions ---------- */
.enter-push{ animation: pushIn .62s var(--spring) both; }
.leave-push{ animation: pushOut .45s var(--ease) both; }
.enter-pop{ animation: popIn .55s var(--spring) both; }
.leave-pop{ animation: popOut .4s var(--ease) both; }
.enter-fade{ animation: fadeUp .5s var(--ease) both; }
@keyframes pushIn{ from{ translate: 18% 0; opacity: 0; } to{ translate: 0 0; opacity: 1; } }
@keyframes pushOut{ to{ translate: -8% 0; opacity: 0; } }
@keyframes popIn{ from{ translate: -8% 0; opacity: 0; } to{ translate: 0 0; opacity: 1; } }
@keyframes popOut{ to{ translate: 18% 0; opacity: 0; } }
@keyframes fadeUp{ from{ translate: 0 14px; opacity: 0; } }
.step-in-next{ animation: stepInNext .55s var(--spring) both; }
.step-in-prev{ animation: stepInPrev .55s var(--spring) both; }
@keyframes stepInNext{ from{ translate: 60px 0; opacity: 0; scale: .97; } }
@keyframes stepInPrev{ from{ translate: -60px 0; opacity: 0; scale: .97; } }
.stagger > *{ animation: fadeUp .7s var(--spring) both; }
.stagger > *:nth-child(2){ animation-delay: .04s; } .stagger > *:nth-child(3){ animation-delay: .08s; }
.stagger > *:nth-child(4){ animation-delay: .12s; } .stagger > *:nth-child(5){ animation-delay: .16s; }
.stagger > *:nth-child(6){ animation-delay: .2s; } .stagger > *:nth-child(7){ animation-delay: .24s; }
.stagger > *:nth-child(n+8){ animation-delay: .28s; }

.local-banner{ display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 22px; margin-bottom: var(--gap); font-size: 15px; color: var(--text-2); }
.local-banner .ico{ color: var(--accent); flex: none; }
.local-banner b{ color: var(--text); }

.footer{ text-align: center; color: var(--text-3); font-size: 13px; margin-top: 48px; }

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .mesh i{ animation: none; }
}

@media print{
  .mesh, .topbar, .dock, .island, .toasts, .r-cta, .icon-btn{ display: none !important; }
  body{ background: #fff; color: #000; }
  .glass{ background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .glass::before{ display: none; }
}

/* ---------- compléments ---------- */
.ico .f{ fill: currentColor; stroke: none; }
.switch{ width: 51px; height: 31px; border-radius: 99px; background: var(--hairline); position: relative; flex: none; transition: background-color .25s; }
.switch::after{ content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: translate .45s var(--spring); }
.switch.on{ background: var(--ok); }
.switch.on::after{ translate: 20px 0; }
.banner{ display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px; border-radius: 22px; margin-bottom: var(--gap); font-size: 15px; }
.banner .ico{ flex: none; color: var(--accent); margin-top: 1px; }
.banner b{ display: block; font-size: 16px; }
.banner p{ color: var(--text-2); }
.banner .btn{ margin-top: 10px; }
.feat.feat-empty{ color: var(--text); padding: 24px; justify-content: center; }
.feat.feat-empty .empty{ padding: 0; }
.feat.feat-empty p{ color: var(--text-2); max-width: 36ch; }
.link-btn{ color: var(--accent); font-weight: 600; }
.trash-row{ display: grid; grid-template-columns: 64px minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 10px 12px 10px 10px; border-radius: 24px; }
.trash-row .mini-cover{ width: 64px; height: 64px; border-radius: 16px; position: relative; overflow: hidden; }
.trash-row b{ display: block; }
.trash-row small{ color: var(--text-2); }
.hero-logo{ cursor: pointer; border-radius: 20px; }
.notfound{ text-align: center; padding: 60px 20px; display: grid; gap: 14px; justify-items: center; }
.ver-row{ display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 12px; align-items: center; }
.ver-row .ico{ color: var(--text-2); }
.ver-row b{ display: block; font-size: 16px; }
.ver-row small{ display: block; color: var(--text-2); font-size: 13px; }

input[type="search"]::-webkit-search-cancel-button, input[type="search"]::-webkit-search-decoration{ -webkit-appearance: none; appearance: none; }

function ic(name, cls = '') { return `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`; }

/* ---------- son (minuteurs) ---------- */
const Sound = {
  ctx: null,
  unlock() {
    try {
      if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) this.ctx = new C(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    } catch {}
  },
  chime() {
    const c = this.ctx; if (!c) return;
    try {
      const t0 = c.currentTime + .02;
      [[0, 880], [.0, 1318.5], [.32, 987.8], [.32, 1480], [.64, 1174.7], [.64, 1760]].forEach(([d, f], i) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = f;
        const peak = i % 2 ? .07 : .16;
        g.gain.setValueAtTime(.0001, t0 + d);
        g.gain.exponentialRampToValueAtTime(peak, t0 + d + .015);
        g.gain.exponentialRampToValueAtTime(.0001, t0 + d + 1.4);
        o.connect(g).connect(c.destination); o.start(t0 + d); o.stop(t0 + d + 1.5);
      });
    } catch {}
  },
};
document.addEventListener('pointerdown', () => Sound.unlock(), { passive: true });
document.addEventListener('touchstart', () => {}, { passive: true }); // active :active sur iOS

/* ---------- maintien de l'écran allumé ---------- */
const Wake = {
  lock: null, want: false,
  async on() { this.want = true; try { if ('wakeLock' in navigator && document.visibilityState === 'visible') { this.lock = await navigator.wakeLock.request('screen'); } } catch {} },
  off() { this.want = false; try { this.lock && this.lock.release(); } catch {} this.lock = null; },
};
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Wake.want) Wake.on(); });

/* ---------- toasts ---------- */
const Toast = {
  box: null,
  show(msg, { action, onAction, ms = 3200 } = {}) {
    if (!this.box) { this.box = frag('<div class="toasts" role="status" aria-live="polite"></div>'); document.body.appendChild(this.box); }
    const t = frag(`<div class="toast"><span>${esc(msg)}</span>${action ? `<button type="button">${esc(action)}</button>` : ''}</div>`);
    this.box.appendChild(t);
    let done = false;
    const close = () => { if (done) return; done = true; t.classList.add('out'); setTimeout(() => t.remove(), 320); };
    if (action) t.querySelector('button').onclick = () => { close(); onAction && onAction(); };
    setTimeout(close, ms);
    return close;
  },
};

/* ---------- feuilles (sheets) ---------- */
const Sheet = {
  stack: [],
  open(html, { full = false, cls = '', onClose, label = '' } = {}) {
    const ov = frag(`<div class="overlay ${cls}" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="scrim"></div><div class="sheet ${full ? 'full' : ''}"><div class="grab"></div>${html}</div></div>`);
    document.body.appendChild(ov);
    const sheet = ov.querySelector('.sheet');
    const api = {
      el: ov, sheet,
      close: (v) => {
        if (api.closed) return; api.closed = true;
        ov.classList.add('closing');
        const i = Sheet.stack.indexOf(api); if (i >= 0) Sheet.stack.splice(i, 1);
        setTimeout(() => ov.remove(), 300);
        onClose && onClose(v);
      },
    };
    ov.querySelector('.scrim').addEventListener('click', () => api.close());
    // glisser vers le bas pour fermer
    const grab = ov.querySelector('.grab');
    let y0 = null, dy = 0;
    const startDrag = e => { y0 = e.clientY; dy = 0; sheet.style.transition = 'none'; };
    grab.addEventListener('pointerdown', e => { startDrag(e); grab.setPointerCapture(e.pointerId); });
    grab.addEventListener('pointermove', e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); sheet.style.translate = `0 ${dy}px`; });
    grab.addEventListener('pointerup', () => { if (y0 == null) return; y0 = null; sheet.style.transition = ''; if (dy > 90) api.close(); else sheet.style.translate = ''; });
    Sheet.stack.push(api);
    setTimeout(() => { const f = sheet.querySelector('[autofocus]'); if (f) f.focus(); }, 60);
    return api;
  },
  closeTop() { const t = Sheet.stack[Sheet.stack.length - 1]; if (t) { t.close(); return true; } return false; },
  confirm({ title, text = '', ok = 'Confirmer', cancel = 'Annuler', danger = false }) {
    return new Promise(res => {
      const s = Sheet.open(`<div class="confirm"><div class="sheet-head"><h2>${esc(title)}</h2></div>${text ? `<p>${esc(text)}</p>` : ''}<div class="actions"><button class="btn btn-lg ${danger ? 'btn-danger' : 'btn-primary'}" data-v="1">${esc(ok)}</button><button class="btn btn-lg btn-ghost" data-v="0">${esc(cancel)}</button></div></div>`, { label: title, onClose: v => res(v === true) });
      s.sheet.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) s.close(b.dataset.v === '1'); });
    });
  },
  actions(title, items) {
    return new Promise(res => {
      const s = Sheet.open(`<div class="sheet-head"><h2>${esc(title)}</h2><button class="icon-btn" data-x aria-label="Fermer">${ic('close')}</button></div><div class="list">${items.map((it, i) => `<button type="button" data-i="${i}" class="${it.danger ? 'btn-danger' : ''}">${ic(it.icon)}<span class="grow">${esc(it.label)}${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</span></button>`).join('')}</div>`, { label: title, onClose: v => res(v ?? null) });
      s.sheet.addEventListener('click', e => {
        if (e.target.closest('[data-x]')) return s.close(null);
        const b = e.target.closest('[data-i]'); if (b) s.close(items[+b.dataset.i].value);
      });
    });
  },
};
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (Sheet.closeTop()) return; if (Spot.close()) return; if (Pad.isOpen && Pad.isOpen()) { Pad.close(); return; } }
});

/* ---------- partage ---------- */
async function shareLink(title, path) {
  const url = location.href.split('#')[0] + '#' + path;
  try {
    if (navigator.share && !IS_PREVIEW) { await navigator.share({ title, url }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(url); Toast.show('Lien copié'); }
  catch { Sheet.open(`<div class="sheet-head"><h2>Lien de la recette</h2></div><input class="field" readonly value="${esc(url)}" onfocus="this.select()"><p class="foot" style="margin-top:10px">Copiez ce lien pour l’envoyer.</p>`, { label: 'Lien' }); }
}

/* ---------- favoris & progression (propres à chaque appareil) ---------- */
const Favs = {
  set: new Set(LS.get('favs', [])),
  has(id) { return this.set.has(id); },
  toggle(id) { this.set.has(id) ? this.set.delete(id) : this.set.add(id); LS.set('favs', [...this.set]); return this.set.has(id); },
};
const Progress = {
  all() { return LS.get('progress', {}); },
  get(id) { return this.all()[id] || null; },
  set(id, p) { const a = this.all(); a[id] = { ...p, at: Date.now() }; LS.set('progress', a); },
  clear(id) { const a = this.all(); delete a[id]; LS.set('progress', a); },
};

const SAMPLES = [{"id":"5b0c6f2e-1c1a-4c3e-9a51-0d2f8c7a1001","title":"Tarte au citron meringuée","category":"patisserie","description":"Une pâte sucrée bien croustillante, une crème au citron acidulée et une meringue légère, dorée au chalumeau.","servings":8,"servings_label":"parts","prep_min":50,"cook_min":30,"rest_min":120,"difficulty":2,"equipment":["Moule à tarte 24 cm","Rouleau à pâtisserie","Billes de cuisson","Batteur électrique","Poche à douille cannelée","Chalumeau (facultatif)"],"ingredients":[{"t":"Pâte sucrée","g":1},{"t":"200 g de farine"},{"t":"100 g de beurre mou"},{"t":"80 g de sucre glace"},{"t":"25 g de poudre d’amande"},{"t":"1 œuf"},{"t":"1 pincée de sel"},{"t":"Crème au citron","g":1},{"t":"3 citrons jaunes non traités"},{"t":"3 œufs"},{"t":"150 g de sucre"},{"t":"20 g de maïzena"},{"t":"80 g de beurre"},{"t":"Meringue","g":1},{"t":"3 blancs d’œufs"},{"t":"150 g de sucre"}],"steps":[{"id":"t1","title":"Sabler la pâte","text":"Dans un saladier, mélangez la farine, le sucre glace, la poudre d’amande et le sel. Ajoutez le beurre mou en petits morceaux et frottez le tout entre vos mains jusqu’à obtenir un sable fin, sans morceaux de beurre visibles.","tip":"","timer":null,"temp":null,"drawing":null,"image":null},{"id":"t2","title":"Former la pâte","text":"Ajoutez l’œuf et mélangez à la maryse, juste assez pour que la pâte se rassemble. Ne la travaillez pas trop, sinon elle deviendrait élastique et rétrécirait à la cuisson. Aplatissez-la en disque, filmez-la et laissez-la reposer 1 h au réfrigérateur.","tip":"Un disque plat refroidit plus vite qu’une boule et s’étale ensuite beaucoup plus facilement.","timer":60,"temp":null,"drawing":null,"image":null},{"id":"t3","title":"Foncer le moule","text":"Étalez la pâte sur 3 mm d’épaisseur entre deux feuilles de papier cuisson. Déposez-la dans le moule beurré et faites-la bien descendre dans les angles en appuyant avec les doigts. Passez le rouleau sur le bord pour couper l’excédent, piquez le fond à la fou in. Retirez papier et billes et poursuivez 10 min, jusqu’à ce que le fond soit bien doré. Laissez refroidir sur une grille.","tip":"","timer":15,"temp":170,"drawing":null,"image":null},{"id":"t5","title":"Préparer la crème au citron","text":"Râpez finement le zeste de 2 citrons, puis pressez les 3 citrons : il faut environ 150 ml de jus. Dans une casserole hors du feu, fouettez les œufs, le sucre et la maïzena, puis ajoutez le jus et les zestes.","tip":"","timer":null,"temp":null,"drawing":null,"image":null},{"id":"t6","title":"Épaissir la crème","text":"Faites chauffer sur feu moyen sans cesser de fouetter. Aux premiers bouillons, la crème épaissit d’un coup : fouettez encore 1 min puis retirez du feu. Ajoutez le beurre en morceaux et fouettez jusqu’à ce que la crème soit lisse et brillante.","tip":"Si quelques grumeaux apparaissent, passez la crème au chinois avant d’ajouter le beurre.","timer":null,"temp":null,"drawing":null,"image":null},{"id":"t7","title":"Garnir le fond","text":"Versez la crème encore chaude sur le fond de tarte refroidi, lissez-la à la spatule et laissez prendre au moins 1 h au réfrigérateur.","tip":"","timer":60,"temp":null,"drawing":null,"image":null},{"id":"t8","title":"Monter la meringue","text":"Dans un bol posé sur une casserole d’eau frémissante, fouettez les blancs et le sucre jusqu’à ce que le mélange soit chaud au toucher, vers 55 °C. Hors du feu, fouettez au batteur à vitesse rapide 8 à 10 min : la meringue doit être ferme, brillante et redevenue tiède.","tip":"Frottez un peu de meringue entre deux doigts : si vous ne sentez plus de grains de sucre, elle est prête.","timer":9,"temp":null,"drawing":null,"image":null},{"id":"t9","title":"Pocher la meringue","text":"Garnissez la poche à douille et pochez de petits dômes serrés sur toute la surface de la crème, en partant du bord. Tirez la poche d’un coup sec vers le haut pour former une petite pointe.","tip":"","timer":null,"temp":null,"drawing":{"w":1000,"h":750,"s":[{"c":"ink","w":9 /** Ingrédient mis à l'échelle → { q: "200 g", n: "farine", raw } */

/* ---------- repérage de durées, températures et ingrédients dans le texte ---------- */
const DUR_RE = /(\d+(?:[.,]\d+)?)\s*(?:(?:à|-|–)\s*(\d+(?:[.,]\d+)?)\s*)?(?:(h|heures?)(?![a-z])(?:\s*(\d{1,2})(?![\d°,.])(?:\s*(?:min(?:utes?)?|mn)(?![a-z]))?)?|(min(?:utes?)?|mn)(?![a-z])|(secondes?|sec|s)(?![a-zà-ÿ]))/gi;
function findDurations(text) {
  const out = []; DUR_RE.lastIndex = 0; let m;
  while ((m = DUR_RE.exec(text))) {
    const a = parseFloat(m[1].replace(',', '.')), b = m[2] ? parseFloat(m[2].replace(',', '.')) : null;
    const mult = m[3] ? 60 : m[5] ? 1 : 1 / 60;
    let min = a * mult; if (m[3] && m[4]) min += parseInt(m[4]);
    const max = b != null ? b * mult : null;
    if (min <= 0 || min > 24 * 60) continue;
    out.push({ index: m.index, len: m[0].length, text: m[0], min, max });
  }
  return out;
}
function findTemp(text) {
  let m = String(text).match(/(\d{2,3})\s*°\s*C?/i); if (m) return parseInt(m[1]);
  m = String(text).match(/\bth(?:ermostat)?\.?\s*(\d{1,2})\b/i); if (m) return parseInt(m[1]) * 30;
  return null;
}
const STOP = new Set(['de', 'du', 'des', 'la', 'le', 'les', 'un', 'une', 'et', 'ou', 'au', 'aux', 'en', 'pour', 'avec', 'sans', 'bien', 'très', 'tres', 'petit', 'petite', 'petits', 'petites', 'gros', 'grosse', 'grand', 'grande', 'frais', 'fraîche', 'fraiche', 'non', 'traités', 'traité', 'traites', 'traite', 'bio', 'environ', 'tout', 'tous', 'puis', 'dans', 'sur', 'par']);
function singular(w) { return w.length > 3 && /[sx]$/.test(w) ? w.slice(0, -1) : w; }
function tokensOf(text) {
  // sensible aux accents : « beurré » (le moule) n'est pas « beurre » (l'ingrédient)
  return String(text || '').toLowerCase().replace(/œ/g, 'oe').replace(/æ/g, 'ae').replace(/\(.*?\)/g, ' ')
    .replace(/[^a-z0-9àâäçéèêëîïôöùûüÿ]+/g, ' ').split(' ').filter(w => w.length > 2 && !STOP.has(w)).map(singular);
}
/** ingrédients mentionnés dans le texte d'une étape (avec les quantités de la liste) */
function ingredientsInText(text, ingredients) {
  const toks = tokensOf(String(text || '').replace(/(^|[\s'’])à\s+blanc(?![a-zà-ÿ])/gi, ' '));
  if (!toks.length) return [];
  const avail = new Map();
  for (const w of toks) avail.set(w, (avail.get(w) || 0) + 1);
  const has = w => (avail.get(w) || 0) > 0;
  const take = w => { if (has(w)) avail.set(w, avail.get(w) - 1); };
  const cands = [], titles = []; let gi = 0;
  for (const it of ingredients || []) {
    if (it.g) { gi++; titles[gi] = tokensOf(it.t); continue; }
    if (!it.t) continue;
    const kw = tokensOf(parseIng(it.t).n);
    if (kw.length) cands.push({ it, gi, kw, key: kw.join(' ') });
  }
  const byKey = new Map();
  for (const c of cands) { if (!byKey.has(c.key)) byKey.set(c.key, []); byKey.get(c.key).push(c); }
  const keys = [...byKey.keys()].sort((a, b) => byKey.get(b)[0].kw.length - byKey.get(a)[0].kw.length);
  const hit = new Set(), used = new Set();
  const fresh = w => has(w) && !used.has(w);
  // 1) tous les mots du nom sont présents (les noms les plus longs d'abord).
  //    Un mot déjà rattaché à un ingrédient (« beurre » de « beurre mou ») ne resert pas.
  for (const k of keys) { const kw = byKey.get(k)[0].kw; if (kw.every(fresh)) { kw.forEach(w => { take(w); used.add(w); }); hit.add(k); } }
  // 2) au moins la moitié des mots (« les jaunes » pour « jaunes d'œufs »)
  for (const k of keys) {
    if (hit.has(k)) continue;
    const kw = byKey.get(k)[0].kw; if (kw.length < 2) continue;
    const found = kw.filter(fresh);
    if (fresh(kw[0]) || found.length >= Math.ceil(kw.length / 2)) { found.forEach(w => { take(w); used.add(w); }); hit.add(k); }
  }
  // 3) même ingrédient dans plusieurs groupes : on garde celui du groupe le plus cohérent avec l'étape
  const score = {}; const all = new Set(toks);
  for (const k of hit) { const l = byKey.get(k); if (l.length === 1) score[l[0].gi] = (score[l[0].gi] || 0) + 1; }
  const chosen = new Set();
  for (const k of hit) {
    const l = byKey.get(k); let best = l[0], bs = -1;
    for (const c of l) { const sc = (score[c.gi] || 0) + ((titles[c.gi] || []).some(w => all.has(w)) ? 2 : 0); if (sc > bs) { bs = sc; best = c; } }
    chosen.add(best);
  }
  return cands.filter(c => chosen.has(c)).map(c => c.it);
}

/* ---------- couvertures générées ---------- */
const PAL = {
  patisserie: ['#ff8fb8', '#ffb38a', '#c6a8ff', '#ffe08a', '#9fe3cf', '#ff9ea0'],
  cuisine: ['#ffb057', '#ff7b59', '#ffd56b', '#9ccf7f', '#f3a3c4', '#7fc9e8'],
};
function coverStyle(r) {
  if (r.cover_url) return `background-image:url('${esc(r.cover_url)}')`;
  const R = rng(hash(r.id || r.title || 'x'));
  const pal = PAL[r.category] || PAL.patisserie;
  const pick = () => pal[Math.floor(R() * pal.length)];
  const g = [];
  for (let i = 0; i < 4; i++) g.push(`radial-gradient(${Math.round(55 + R() * 40)}% ${Math.round(55 + R() * 40)}% at ${Math.round(R() * 100)}% ${Math.round(R() * 100)}%, ${pick()} 0%, transparent 70%)`);
  return `background-image:${g.join(',')},linear-gradient(${Math.round(R() * 360)}deg, ${pick()}, ${pick()})`;
}
/** couverture : la photo, sinon le premier dessin de la recette tracé à la craie, sinon une icône */
function coverHTML(r, deco = true) {
  if (r.cover_url) return `<div class="art" style="${coverStyle(r)}"></div>`;
  let inner = '';
  if (deco) {
    const st = deco === 'icon' ? null : (r.steps || []).find(s => s && s.drawing && s.drawing.s && s.drawing.s.length);
    inner = st ? coverSketch(st.drawing) : ic(r.category === 'cuisine' ? 'pot' : 'whisk', 'art-ico');
  }
  return `<div class="art" style="${coverStyle(r)}">${inner}</div>`;
}
function coverSketch(dr) {
  const paths = dr.s.map(x => `<path d="${strokePath(x.p)}"/>`).join('');
  return `<svg class="art-sketch" viewBox="0 0 ${dr.w || 1000} ${dr.h || 750}" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
}

/* ---------- images : redimensionnement avant envoi ---------- */
async function shrinkImage(file, max = 1600, quality = .82) {
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch {
    bmp = await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); });
  }
  const w0 = bmp.width, h0 = bmp.height, k = Math.min(1, max / Math.max(w0, h0));
  const w = Math.round(w0 * k), h = Math.round(h0 * k);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  const blob = await new Promise(res => c.toBlob(b => res(b), 'image/webp', quality));
  if (blob && blob.type === 'image/webp') return blob;
  return await new Promise(res => c.toBlob(b => res(b), 'image/jpeg', quality));
}
function blobToDataURL(b) { return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); }); }

/* ---------- magasin de recettes ---------- */
const Store = {
  mode: (CFG.SUPABASE_URL && CFG.SUPABASE_KEY && !IS_PREVIEW) ? 'cloud' : 'local',
  map: new Map(), status: 'idle', error: '', sb: null, ready: false, lastSync: 0, subs: new Set(), local: null,
  on(fn) { this.subs.add(fn); return () => this.subs.delete(fn); },
  emit() { for (const f of [...this.subs]) { try { f(); } catch (e) { console.error(e); } } },
  setStatus(s, err = '') { this.status = s; this.error = err; this.emit(); },
  all() { return [...this.map.values()].sort((a, b) => String(b.updated_at || '').localeCompare(String(a.updated_at || ''))); },
  get(id) { return this.map.get(id) || null; },

  async init() {
    if (this.mode === 'local') {
      this.local = await IDB.get('local-db');
      if (!this.local) {
        // premier lancement sans Supabase : quelques recettes d'exemple pour découvrir
        this.local = { recipes: {}, versions: [] };
        const now = Date.now();
        SAMPLES.forEach((s, i) => { const r = fixRecipe(clone(s)); r.created_at = r.updated_at = new Date(now - i * 3600e3).toISOString(); this.local.recipes[r.id] = r; });
        await IDB.set('local-db', this.local);
      }
      this.rebuildLocal(); this.ready = true; this.status = 'local'; this.emit();
      return;
    }
    const cache = await IDB.get('cloud-cache');
    if (cache) for (const r of Object.values(cache)) this.map.set(r.id, fixRecipe(r));
    this.ready = true; this.emit();
    this.sync();
    window.addEventListener('online', () => this.sync());
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - this.lastSync > 45e3) this.sync(); });
  },
  rebuildLocal() {
    this.map.clear();
    for (const r of Object.values(this.local.recipes)) if (!r.deleted_at) this.map.set(r.id, fixRecipe(r));
  },
  async persistLocal() { await IDB.set('local-db', this.local); },
  async persistCache() { const o = {}; for (const [k, v] of this.map) o[k] = v; await IDB.set('cloud-cache', o); },

  async client() {
    if (this.sb) return this.sb;
    if (!window.supabase) await loadScript(SB_SCRIPT);
    const url = String(CFG.SUPABASE_URL).trim().replace(/\/+$/, '').replace(/\/rest\/v1$/, '');
    this.sb = window.supabase.createClient(url, String(CFG.SUPABASE_KEY).trim(), { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
    return this.sb;
  },
  explain(e) {
    const m = String((e && (e.message || e.error_description || e.hint)) || e || '');
    if (/relation .* does not exist|could not find the table|schema cache/i.test(m)) return 'La base n’est pas encore prête : exécutez le fichier schema.sql dans Supabase.';
    if (/invalid api key|no api key|jwt|unauthorized|401/i.test(m)) return 'Clé Supabase refusée : vérifiez SUPABASE_KEY dans index.html.';
    if (/failed to fetch|network|load failed|script indisponible/i.test(m)) return 'Connexion impossible. Les recettes affichées sont celles gardées sur cet appareil.';
    return m || 'Erreur inconnue';
  },
  _syncing: null,
  async sync() {
    if (this.mode !== 'cloud') return;
    if (this._syncing) return this._syncing;
    if (navigator.onLine === false) { this.setStatus('offline'); return; }
    this._syncing = (async () => {
      this.setStatus('sync');
      try {
        const sb = await this.client();
        const { data: heads, error } = await sb.from('recipes').select('id,updated_at').is('deleted_at', null);
        if (error) throw error;
        const live = new Set(heads.map(h => h.id));
        let changed = false;
        for (const id of [...this.map.keys()]) if (!live.has(id)) { this.map.delete(id); changed = true; }
        const need = heads.filter(h => { const c = this.map.get(h.id); return !c || c.updated_at !== h.updated_at; }).map(h => h.id);
        for (let i = 0; i < need.length; i += 40) {
          const { data, error: e2 } = await sb.from('recipes').select('*').in('id', need.slice(i, i + 40));
          if (e2) throw e2;
          for (const r of data) this.map.set(r.id, fixRecipe(r));
          changed = true;
        }
        if (changed) await this.persistCache();
        this.lastSync = Date.now();
        this.setStatus('ok');
      } catch (e) {
        console.warn(e);
        this.setStatus(navigator.onLine === false ? 'offline' : 'error', this.explain(e));
      } finally { this._syncing = null; }
    })();
    return this._syncing;
  },

  /** enregistre ; lève {conflict:true} si la recette a changé ailleurs */
  async save(r, { force = false } = {}) {
    r = fixRecipe(r);
    const isNew = !this.get(r.id) && !r.updated_at;
    const base = r._base || null;
    if (this.mode === 'local') {
      const cur = this.local.recipes[r.id];
      if (cur && !force && base && cur.updated_at !== base) throw { conflict: true };
      if (cur) this.localVersion(cur, 'modification');
      const now = new Date().toISOString();
      const saved = { ...toRow(r), created_at: cur ? cur.created_at : now, updated_at: now, deleted_at: null };
      this.local.recipes[r.id] = saved; await this.persistLocal(); this.rebuildLocal(); this.emit();
      return this.get(r.id);
    }
    const sb = await this.client();
    let res;
    if (isNew) {
      res = await sb.from('recipes').insert(toRow(r)).select();
      if (res.error && String(res.error.code) === '23505') { const row = toRow(r); delete row.id; row.deleted_at = null; res = await sb.from('recipes').update(row).eq('id', r.id).select(); }
    } else {
      const row = toRow(r); delete row.id;
      let q = sb.from('recipes').update(row).eq('id', r.id);
      if (!force && base) q = q.eq('updated_at', base);
      res = await q.select();
    }
    if (res.error) throw res.error;
    if (!res.data || !res.data.length) { if (!isNew && !force) throw { conflict: true }; throw new Error('Recette introuvable'); }
    const saved = fixRecipe(res.data[0]);
    this.map.set(saved.id, saved); await this.persistCache(); this.emit();
    return saved;
  },
  localVersion(row, action) {
    this.local.versions.unshift({ id: uid(), recipe_id: row.id, action, created_at: new Date().toISOString(), snapshot: clone(row) });
    const per = {}; this.local.versions = this.local.versions.filter(v => (per[v.recipe_id] = (per[v.recipe_id] || 0) + 1) <= 40);
  },
  async remove(id) {
    if (this.mode === 'local') {
      const cur = this.local.recipes[id]; if (!cur) return;
      this.localVersion(cur, 'suppression');
      cur.deleted_at = new Date().toISOString(); await this.persistLocal(); this.rebuildLocal(); this.emit(); return;
    }
    const sb = await this.client();
    const { error } = await sb.from('recipes').update({ deleted_at: new Date().toISOString() }).eq('id', id);
    if (error) throw error;
    this.map.delete(id); await this.persistCache(); this.emit();
  },
  async restore(id) {
    if (this.mode === 'local') {
      const cur = this.local.recipes[id]; if (!cur) return;
      this.localVersion(cur, 'restauration');
      cur.deleted_at = null; cur.updated_at = new Date().toISOString(); await this.persistLocal(); this.rebuildLocal(); this.emit(); return;
    }
    const sb = await this.client();
    const { data, error } = await sb.from('recipes').update({ deleted_at: null }).eq('id', id).select();
    if (error) throw error;
    if (data && data[0]) { this.map.set(id, fixRecipe(data[0])); await this.persistCache(); }
    this.emit();
  },
  async trash() {
    if (this.mode === 'local') return Object.values(this.local.recipes).filter(r => r.deleted_at).sort((a, b) => b.deleted_at.localeCompare(a.deleted_at));
    const sb = await this.client();
    const { data, error } = await sb.from('recipes').select('id,title,category,cover_url,deleted_at').not('deleted_at', 'is', null).order('deleted_at', { ascending: false });
    if (error) throw error; return data;
  },
  async versions(id) {
    if (this.mode === 'local') return this.local.versions.filter(v => v.recipe_id === id).map(v => ({ id: v.id, action: v.action, created_at: v.created_at, title: v.snapshot.title, steps: (v.snapshot.steps || []).length }));
    const sb = await this.client();
    const { data, error } = await sb.from('recipe_versions').select('id,action,created_at,title:snapshot->>title').eq('recipe_id', id).order('created_at', { ascending: false }).limit(60);
    if (error) throw error; return data;
  },
  async versionSnapshot(vid) {
    if (this.mode === 'local') { const v = this.local.versions.find(x => x.id === vid); return v ? clone(v.snapshot) : null; }
    const sb = await this.client();
    const { data, error } = await sb.from('recipe_versions').select('snapshot').eq('id', vid).single();
    if (error) throw error; return data.snapshot;
  },
  async uploadImage(file) {
    const blob = await shrinkImage(file);
    if (this.mode === 'local') return await blobToDataURL(await shrinkImage(blob, 1200, .78));
    const sb = await this.client();
    const ext = blob.type === 'image/webp' ? 'webp' : 'jpg';
    const path = `recettes/${new Date().toISOString().slice(0, 7)}/${uid()}.${ext}`;
    const { error } = await sb.storage.from('images').upload(path, blob, { contentType: blob.type, cacheControl: '31536000', upsert: false });
    if (error) throw error;
    return sb.storage.from('images').getPublicUrl(path).data.publicUrl;
  },
  async importMany(list) {
    let n = 0;
    for (const raw of list) {
      const r = fixRecipe(raw); delete r._base;
      const exists = this.get(r.id);
      if (exists) { r.updated_at = exists.updated_at; await this.save(r, { force: true }); }
      else { r.updated_at = null; await this.save(r); }
      n++;
    }
    return n;
  },
};

    if (!svg) return Promise.resolve();
    svg.style.visibility = '';
    if (svg._anims) svg._anims.forEach(a => { try { a.cancel(); } catch {} });
    if (reduceMotion() || !svg.animate) return Promise.resolve();
    const d = HAND_DATA[svg.dataset.key]; const sw = +svg.dataset.sw || 60;
    const els = [...svg.querySelectorAll('path.ink')];
    const items = []; let W = 0, pi = 0, lifted = false;
    for (const s of d.s) {
      if (!s.d) { const w = s.p * .3; items.push({ w }); W += w; continue; }
      const el = els[pi++];
      if (s.k === 'dot') { items.push({ el, dot: true, w: 220 }); W += 220; continue; }
      if (s.k === 'd' && !lifted) { items.push({ w: 260 }); W += 260; lifted = true; }
      let L = 0; try { L = el.getTotalLength(); } catch {}
      items.push({ el, L, w: Math.max(L, 1) }); W += Math.max(L, 1);
    }
    const Einv = u => Math.acos(1 - 2 * clamp(u, 0, 1)) / Math.PI;
    let acc = 0; const anims = [];
    for (const it of items) {
      const u0 = acc / W, u1 = (acc + it.w) / W; acc += it.w;
      if (!it.el) continue;
      const t0 = duration * Einv(u0), t1 = duration * Einv(u1);
      if (it.dot) {
        anims.push(it.el.animate([{ strokeWidth: 0 }, { strokeWidth: sw * 1.5, offset: .55 }, { strokeWidth: sw * 1.12 }], { duration: 420, delay: delay + t0, easing: 'cubic-bezier(.3,1.4,.5,1)', fill: 'both' }));
        continue;
      }
      it.el.style.strokeDasharray = `${it.L} ${it.L + sw * 2}`;
      anims.push(it.el.animate([{ strokeDashoffset: it.L + sw }, { strokeDashoffset: 0 }], { duration: Math.max(16, t1 - t0), delay: delay + t0, easing: 'linear', fill: 'both' }));
    }
    svg._anims = anims;
    return Promise.all(anims.map(a => a.finished)).then(() => {
      els.forEach(el => { el.style.strokeDasharray = ''; });
      anims.forEach(a => { try { a.cancel(); } catch {} });
    }).catch(() => {});
  },
};

/* ---------- dessins (traits vectoriels 1000 × 750) ---------- */
function strokePath(p) {
  if (!p || p.length < 2) return '';
  if (p.length < 4) return `M${p[0]} ${p[1]}l.01 0`;
  if (p.length === 4) return `M${p[0]} ${p[1]}L${p[2]} ${p[3]}`;
  let d = `M${p[0]} ${p[1]}`;
  for (let i = 2; i < p.length - 2; i += 2) {
    const mx = (p[i] + p[i + 2]) / 2, my = (p[i + 1] + p[i + 3]) / 2;
    d += `Q${p[i]} ${p[i + 1]} ${mx.toFixed(1)} ${my.toFixed(1)}`;
  }
  d += `L${p[p.length - 2]} ${p[p.length - 1]}`;
  return d;
}
function sketchSVG(dr, cls = '') {
  if (!dr || !dr.s) return '';
  const paths = dr.s.map(st => `<path d="${strokePath(st.p)}" stroke="${st.c === 'ink' ? 'currentColor' : esc(st.c)}" stroke-width="${st.w}"/>`).join('');
  return `<svg class="sketch ${cls}" viewBox="0 0 ${dr.w || 1000} ${dr.h || 750}" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Dessin de l’étape">${paths}</svg>`;
}
function playSketch(svg, maxDur = 1900) {
  if (!svg || reduceMotion() || !svg.animate) return;
  const ps = [...svg.querySelectorAll('path')];
  const Ls = ps.map(p => { try { return p.getTotalLength(); } catch { return 0; } });
  const total = Ls.reduce((a, b) => a + b, 0) || 1;
  const dur = Math.min(maxDur, 450 + total * .35);
  let t = 0;
  ps.forEach((p, i) => {
    const L = Ls[i] || 1, d = Math.max(36, dur * L / total);
    p.style.strokeDasharray = `${L} ${L + 40}`;
    const a = p.animate([{ strokeDashoffset: L + 20 }, { strokeDashoffset: 0 }], { duration: d, delay: 120 + t, easing: 'cubic-bezier(.45,.05,.4,1)', fill: 'both' });
    a.finished.then(() => { p.style.strokeDasharray = ''; try { a.cancel(); } catch {} }).catch(() => {});
    t += d * .82;
  });
}

# SimpleSugar · garde la base Supabase éveillée
# Le plan gratuit de Supabase met un projet en pause après une semaine sans activité.
# Cette tâche consulte la base tous les deux jours pour l'éviter.
# Les deux réglages sont lus directement dans index.html : rien d'autre à configurer.
name: Garder Supabase éveillé

on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Interroger Supabase
        run: |
          URL=$(grep -oE "SUPABASE_URL: *'[^']+'" index.html | sed -E "s/.*'([^']+)'/\1/" | sed -E 's#/+$##; s#/rest/v1$##')
          KEY=$(grep -oE "SUPABASE_KEY: *'[^']+'" index.html | sed -E "s/.*'([^']+)'/\1/")
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Les réglages Supabase sont vides dans index.html : rien à faire."
            exit 0
          fi
          curl -fsS "$URL/rest/v1/recipes?select=id&limit=1" -H "apikey: $KEY" -o /dev/null
          echo "Supabase a répondu : le projet reste actif."
